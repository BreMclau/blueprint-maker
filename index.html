      // Auto-named pill/strip: fixed header label + colors + Delete + Save
      // (no name input, no Edit toggle, no Duplicate)
      const label = sh.type === 'driveway' ? 'Driveway' : 'Road';
      html =
        '<div class="entity-label">' + label + '</div>' +
        '<div class="title">Color</div>' + swatches +
        sizeBlockHtml(sh) +
        '<div class="row">' +
          '<button class="danger" data-role="delete" type="button">Delete</button>' +
          '<button class="primary" data-role="save" type="button">Save</button>' +
        '</div>';
    } else if (sh.type === 'tree' || sh.type === 'bush') {
      // Tree / Bush — minimal panel: size + a Delete button.
      // The 8 resize handles are always on (rendered by rebuildSelectionAccessories).
      html =
        sizeBlockHtml(sh) +
        '<div class="row">' +
          '<button class="danger" data-role="delete" type="button">Delete</button>' +
        '</div>';
    } else if (sh.type === 'septic' || sh.type === 'wellhead') {
      // Fixed-label utility shapes — always editable: colors + size + measurements +
      // Duplicate + Delete + Save (no Edit toggle).
      const label = sh.type === 'septic' ? 'Septic Tank' : 'Well Head';
      html =
        '<div class="entity-label">' + label + '</div>' +
        '<div class="title">Color</div>' + swatches +
        sizeBlockHtml(sh) +
        measurementsBlockHtml(sh.measurements) +
        '<div class="row">' +
          '<button data-role="duplicate" type="button">Duplicate</button>' +
          '<button class="danger" data-role="delete" type="button">Delete</button>' +
        '</div>' +
        '<div class="row">' +
          '<button class="primary" data-role="save" type="button">Save</button>' +
        '</div>';
    } else {
      // Regular shapes (square/rectangle/circle/triangle) — name + size + measurements
      html =
        '<div class="title">Name</div>' +
        '<input type="text" data-role="name" value="' + escHtml(sh.name) + '" placeholder="Untitled" autocomplete="off">' +
        '<div class="name-chips" data-role="chips"></div>' +
        '<div class="title" style="margin-top:12px;">Color</div>' + swatches +
        sizeBlockHtml(sh) +
        measurementsBlockHtml(sh.measurements) +
        '<div class="row">' +
          '<button data-role="duplicate" type="button">Duplicate</button>' +
        '</div>' +
        saveRow;
    }
  } else if (sel.kind === 'arrow') {
    const a = state.arrows.find(x => x.id === sel.id);
    if (!a) { entityPopup.style.display = 'none'; return; }
    html =
      '<div class="title">Color</div>' +
      '<div class="swatches">' +
        COLORS.map(c => '<button type="button" class="swatch ' + (a.color === c ? 'sel' : '') + '" data-color="' + c + '" style="background:' + c + '"></button>').join('') +
      '</div>' +
      '<div class="title" style="margin-top:12px;">Distance</div>' +
      '<input type="text" data-role="arrow-distance" value="' + escHtml(a.distance || '') + '" placeholder="e.g. 50 ft" autocomplete="off">' +
      measurementsBlockHtml(a.measurements) +
      '<div class="row">' +
        '<button data-role="duplicate" type="button">Duplicate</button>' +
        '<button class="danger" data-role="delete" type="button">Delete</button>' +
      '</div>' +
      editOrSaveRow;
  } else if (sel.kind === 'fence') {
    const f = state.fences.find(x => x.id === sel.id);
    if (!f) { entityPopup.style.display = 'none'; return; }
    const rawAngle = Math.atan2(f.y2 - f.y1, f.x2 - f.x1) * 180 / Math.PI;
    const angleDeg = Math.round(((rawAngle % 360) + 360) % 360);
    html =
      '<div class="title">Color</div>' +
      '<div class="swatches">' +
        COLORS.map(c => '<button type="button" class="swatch ' + (f.color === c ? 'sel' : '') + '" data-color="' + c + '" style="background:' + c + '"></button>').join('') +
      '</div>' +
      '<div class="title" style="margin-top:12px;">Rotation</div>' +
      '<div class="slider-row">' +
        '<input type="range" data-role="fence-rotation" min="0" max="359" value="' + angleDeg + '">' +
        '<span class="lbl" data-role="fence-rotation-val">' + angleDeg + '°</span>' +
      '</div>' +
      measurementsBlockHtml(f.measurements) +
      '<div class="row">' +
        '<button class="danger" data-role="delete" type="button">Delete</button>' +
      '</div>' +
      editOrSaveRow;
  }
  // Opacity slider — basic shapes only (Square / Rectangle / Circle / Triangle)
  const selSh = sel.kind === 'shape' ? state.shapes.find(s => s.id === sel.id) : null;
  if (selSh && OPACITY_SHAPE_TYPES.includes(selSh.type)) {
    const pct = Math.round((selSh.opacity != null ? selSh.opacity : 1) * 100);
    html +=
      '<div class="title" style="margin-top:12px;">Opacity</div>' +
      '<div class="slider-row">' +
        '<input type="range" data-role="opacity" min="20" max="100" value="' + pct + '">' +
        '<span class="lbl" data-role="opacity-val">' + pct + '%</span>' +
      '</div>';
  }

  // Layer controls — every item gets Bring Up / Send Down
  html +=
    '<div class="title" style="margin-top:12px;">Layer</div>' +
    '<div class="row" style="justify-content:flex-start;">' +
      '<button data-role="send-down" type="button">&#9660; Send Down</button>' +
      '<button data-role="bring-up" type="button">&#9650; Bring Up</button>' +
    '</div>';

  entityPopup.innerHTML = html;
  entityPopup.classList.toggle('readonly', !shouldUnlockPanel());
  entityPopup.style.display = 'block';
  positionPanel();
  wirePanel();
}

function wirePanel() {
  entityPopup.onmousedown = (e) => e.stopPropagation();
  entityPopup.onclick = (e) => e.stopPropagation();

  const sel = state.selection;
  if (!sel) return;

  // Name input + saved-name chips (shape)
  const nameInput = entityPopup.querySelector('input[data-role="name"]');
  if (nameInput) {
    const renderChips = () => {
      const chipsEl = entityPopup.querySelector('[data-role="chips"]');
      if (!chipsEl) return;
      chipsEl.innerHTML = '';
      const top = topNames(5);
      for (const n of top) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'name-chip';
        b.textContent = n;
        b.addEventListener('click', () => useChip(n));
        chipsEl.appendChild(b);
      }
    };
    const tryRecord = () => {
      const v = (nameInput.value || '').trim();
      const orig = nameInput.dataset.original || '';
      if (v && v !== orig) {
        recordName(v);
        nameInput.dataset.original = v;
        renderChips();
      }
    };
    const useChip = (name) => {
      nameInput.value = name;
      const sh = state.shapes.find(s => s.id === sel.id);
      if (sh) {
        sh.name = name;
        const el = shapeEls.get(sh.id);
        if (el) el.querySelector('.shape-name').textContent = name;
      }
      tryRecord();
    };
    nameInput.addEventListener('focus', () => {
      nameInput.dataset.original = nameInput.value;
    });
    nameInput.addEventListener('input', () => {
      const sh = state.shapes.find(s => s.id === sel.id);
      if (!sh) return;
      sh.name = nameInput.value;
      const el = shapeEls.get(sh.id);
      if (el) el.querySelector('.shape-name').textContent = sh.name;
    });
    nameInput.addEventListener('blur', tryRecord);
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); tryRecord(); nameInput.blur(); }
      else if (e.key === 'Escape') { e.preventDefault(); nameInput.blur(); }
    });
    renderChips();
  }

  // Color swatches
  entityPopup.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      const c = sw.dataset.color;
      if (sel.kind === 'shape') {
        const sh = state.shapes.find(s => s.id === sel.id);
        if (sh) { sh.color = c; applyShapeVisual(sh); }
      } else if (sel.kind === 'arrow') {
        const a = state.arrows.find(x => x.id === sel.id);
        if (a) { a.color = c; renderOverlay(); }
      } else if (sel.kind === 'fence') {
        const f = state.fences.find(x => x.id === sel.id);
        if (f) { f.color = c; renderOverlay(); }
      }
      entityPopup.querySelectorAll('.swatch').forEach(s => s.classList.toggle('sel', s.dataset.color === c));
    });
  });

  // Delete (arrow, fence, or road/driveway shape — regular shapes use the corner button)
  const delBtn = entityPopup.querySelector('button[data-role="delete"]');
  if (delBtn) {
    delBtn.addEventListener('click', () => {
      if (sel.kind === 'arrow') deleteArrow(sel.id);
      else if (sel.kind === 'fence') deleteFence(sel.id);
      else if (sel.kind === 'shape') deleteShape(sel.id);
    });
  }

  // Duplicate (any selectable item)
  const dupBtn = entityPopup.querySelector('button[data-role="duplicate"]');
  if (dupBtn) {
    dupBtn.addEventListener('click', () => {
      if (sel.kind === 'shape') duplicateShape(sel.id);
      else if (sel.kind === 'arrow') duplicateArrow(sel.id);
    });
  }

  // Save — persists the entire canvas state and closes the panel
  const saveBtn = entityPopup.querySelector('button[data-role="save"]');
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      persistCanvas();
      deselect();
    });
  }

  // Edit — unlocks the panel inputs and shows resize handles / edge strips
  const editBtn = entityPopup.querySelector('button[data-role="edit"]');
  if (editBtn) {
    editBtn.addEventListener('click', () => {
      state.editing = true;
      renderPanel();
      // Refresh per-entity visual accessories so handles + strips appear
      if (sel.kind === 'shape') {
        const sh = state.shapes.find(s => s.id === sel.id);
        if (sh) applyShapeVisual(sh);
      }
      renderOverlay();
    });
  }

  // Fence rotation slider (edit mode only — disabled handles the read-only case)
  const rotInput = entityPopup.querySelector('input[data-role="fence-rotation"]');
  if (rotInput) {
    const rotLbl = entityPopup.querySelector('[data-role="fence-rotation-val"]');
    rotInput.addEventListener('input', () => {
      const f = state.fences.find(x => x.id === sel.id);
      if (!f) return;
      const angleDeg = parseInt(rotInput.value, 10) || 0;
      rotateFence(f, angleDeg);
      if (rotLbl) rotLbl.textContent = angleDeg + '°';
      renderOverlay();
      positionPanel();
    });
  }

  // Layer controls — Bring Up / Send Down (every item, always active)
  const buBtn = entityPopup.querySelector('button[data-role="bring-up"]');
  if (buBtn) buBtn.addEventListener('click', () => changeLayer(1));
  const sdBtn = entityPopup.querySelector('button[data-role="send-down"]');
  if (sdBtn) sdBtn.addEventListener('click', () => changeLayer(-1));

  // Opacity slider — basic shapes only (always adjustable)
  const opInput = entityPopup.querySelector('input[data-role="opacity"]');
  if (opInput) {
    const opLbl = entityPopup.querySelector('[data-role="opacity-val"]');
    opInput.addEventListener('input', () => {
      const sh = state.shapes.find(s => s.id === sel.id);
      if (!sh) return;
      const pct = parseInt(opInput.value, 10) || 100;
      sh.opacity = pct / 100;
      applyShapeVisual(sh);
      if (opLbl) opLbl.textContent = pct + '%';
    });
  }

  // Width / Height (feet) inputs — type an exact size. These stay in sync with
  // handle resizing (handles update these values; these update the shape).
  const widthInput = entityPopup.querySelector('input[data-role="width-ft"]');
  const heightInput = entityPopup.querySelector('input[data-role="height-ft"]');
  function applySizeFromInput(which, valFt) {
    const sh = state.shapes.find(s => s.id === sel.id);
    if (!sh) return;
    let px = feetToPx(valFt);
    if (!isFinite(px) || px <= 0) return;
    px = Math.max(MIN_SIZE, px);
    const cs = canvasSize();
    if (which === 'w') sh.w = Math.min(px, cs.w - sh.x);
    else sh.h = Math.min(px, cs.h - sh.y);
    applyShapeVisual(sh);
    positionPanel();
  }
  if (widthInput) {
    widthInput.addEventListener('input', () => applySizeFromInput('w', parseFloat(widthInput.value)));
    // On blur, snap the field to the shape's actual (clamped) width.
    widthInput.addEventListener('change', () => {
      const sh = state.shapes.find(s => s.id === sel.id);
      if (sh) widthInput.value = pxToFeet(sh.w);
      persistCanvas();
    });
  }
  if (heightInput) {
    heightInput.addEventListener('input', () => applySizeFromInput('h', parseFloat(heightInput.value)));
    heightInput.addEventListener('change', () => {
      const sh = state.shapes.find(s => s.id === sel.id);
      if (sh) heightInput.value = pxToFeet(sh.h);
      persistCanvas();
    });
  }

  // Lock all inputs when the panel is in read-only mode. Range inputs ignore
  // `readonly`, so use `disabled` for those (and checkboxes/radios). Roads,
  // driveways, trees, and bushes are always directly editable so they skip this.
  // The opacity slider stays usable regardless of edit mode.
  if (!shouldUnlockPanel()) {
    entityPopup.querySelectorAll('input').forEach(inp => {
      if (inp.dataset.role === 'opacity') return;
      // Width / Height inputs are always editable so any shape can be resized.
      if (inp.dataset.role === 'width-ft' || inp.dataset.role === 'height-ft') return;
      const t = inp.type;
      if (t === 'range' || t === 'checkbox' || t === 'radio') {
        inp.disabled = true;
      } else {
        inp.setAttribute('readonly', 'readonly');
      }
    });
  }

  // Measurement inputs (per-side / per-unit, all entity kinds)
  entityPopup.querySelectorAll('input[data-meas-side]').forEach(inp => {
    const side = inp.dataset.measSide;
    const unit = inp.dataset.measUnit; // 'feet' or 'inches'
    inp.addEventListener('focus', () => closeMeasurePopup());
    inp.addEventListener('input', () => {
      const target = sel.kind === 'shape'
        ? state.shapes.find(s => s.id === sel.id)
        : sel.kind === 'arrow'
          ? state.arrows.find(x => x.id === sel.id)
          : sel.kind === 'fence'
            ? state.fences.find(f => f.id === sel.id)
            : null;
      if (!target) return;
      if (!target.measurements) target.measurements = emptyMeasurements();
      if (!target.measurements[side] || typeof target.measurements[side] !== 'object') {
        target.measurements[side] = { feet: '', inches: '' };
      }
      target.measurements[side][unit] = inp.value;
      if (sel.kind === 'shape') {
        const el = shapeEls.get(target.id);
        if (el) rebuildMeasurementLabels(el, target);
      } else {
        renderOverlay();
      }
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === 'Escape') {
        e.preventDefault();
        inp.blur();
      }
    });
  });

  // Arrow distance input (centered along the arrow line)
  const distInput = entityPopup.querySelector('input[data-role="arrow-distance"]');
  if (distInput) {
    distInput.addEventListener('input', () => {
      const a = state.arrows.find(x => x.id === sel.id);
      if (!a) return;
      a.distance = distInput.value;
      renderOverlay();
    });
    distInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === 'Escape') {
        e.preventDefault();
        distInput.blur();
      }
    });
  }
}

function positionPanel() {
  if (!state.selection) return;
  const sel = state.selection;
  const PAD = 12;
  let anchor = null;
  if (sel.kind === 'shape') {
    const el = shapeEls.get(sel.id);
    if (!el) return;
    anchor = el.getBoundingClientRect();
  } else if (sel.kind === 'arrow') {
    const a = state.arrows.find(x => x.id === sel.id);
    if (!a) return;
    const cr = canvasEl.getBoundingClientRect();
    const mx = cr.left + (a.x1 + a.x2) / 2;
    const my = cr.top + (a.y1 + a.y2) / 2;
    anchor = { left: mx, top: my, right: mx + 1, bottom: my + 1, width: 0, height: 0 };
  } else if (sel.kind === 'fence') {
    const f = state.fences.find(x => x.id === sel.id);
    if (!f) return;
    const cr = canvasEl.getBoundingClientRect();
    const mx = cr.left + (f.x1 + f.x2) / 2;
    const my = cr.top + (f.y1 + f.y2) / 2;
    anchor = { left: mx, top: my, right: mx + 1, bottom: my + 1, width: 0, height: 0 };
  }
  if (!anchor) return;
  const pw = entityPopup.offsetWidth || 240;
  const ph = entityPopup.offsetHeight || 120;
  let x = anchor.right + PAD;
  let y = anchor.top;
  if (x + pw > window.innerWidth - PAD) {
    x = anchor.left - pw - PAD;
  }
  // Final clamp so the panel is always fully on-screen, even on small devices
  x = Math.min(Math.max(PAD, x), Math.max(PAD, window.innerWidth - pw - PAD));
  y = Math.min(Math.max(PAD, y), Math.max(PAD, window.innerHeight - ph - PAD));
  entityPopup.style.left = x + 'px';
  entityPopup.style.top = y + 'px';
}

// ============= MEASUREMENT POPUP =============

function openMeasurePopup(entity, side, e, kind) {
  kind = kind || 'shape';
  if (!entity.measurements) {
    entity.measurements = emptyMeasurements();
  }
  if (!entity.measurements[side] || typeof entity.measurements[side] !== 'object') {
    entity.measurements[side] = { feet: '', inches: '' };
  }
  const cur = entity.measurements[side];

  const ep = evtPoint(e);
  const x = ep.clientX, y = ep.clientY;
  measurePopup.innerHTML =
    '<div class="title">' + side + ' edge</div>' +
    '<div class="ft-in-popup">' +
      '<div class="ft-in-popup-field"><label>Feet</label>' +
      '<input type="number" min="0" data-role="meas-feet" value="' + escHtml(cur.feet || '') + '" autocomplete="off"></div>' +
      '<div class="ft-in-popup-field"><label>Inches</label>' +
      '<input type="number" min="0" data-role="meas-inches" value="' + escHtml(cur.inches || '') + '" autocomplete="off"></div>' +
    '</div>' +
    '<div class="row">' +
      '<button data-role="clear" type="button">Clear</button>' +
      '<button class="primary" data-role="save" type="button">Save</button>' +
    '</div>';
  measurePopup.style.display = 'block';

  // Position with viewport clamp (kept fully on-screen on small devices)
  const pw = measurePopup.offsetWidth || 240, ph = measurePopup.offsetHeight || 140;
  let px = x + 8, py = y + 8;
  if (px + pw > window.innerWidth - 8) px = x - pw - 8;
  if (py + ph > window.innerHeight - 8) py = y - ph - 8;
  px = Math.min(Math.max(8, px), Math.max(8, window.innerWidth - pw - 8));
  py = Math.min(Math.max(8, py), Math.max(8, window.innerHeight - ph - 8));
  measurePopup.style.left = px + 'px';
  measurePopup.style.top = py + 'px';

  const fInp = measurePopup.querySelector('input[data-role="meas-feet"]');
  const iInp = measurePopup.querySelector('input[data-role="meas-inches"]');
  fInp.focus();
  fInp.select();

  const refresh = () => {
    if (kind === 'shape') {
      const el = shapeEls.get(entity.id);
      if (el) rebuildMeasurementLabels(el, entity);
    } else if (kind === 'arrow' || kind === 'fence') {
      renderOverlay();
    }
    // Sync same-side ft/in inputs in the entity panel, if visible (top/right only)
    const panelFt = entityPopup.querySelector('input[data-meas-side="' + side + '"][data-meas-unit="feet"]');
    const panelIn = entityPopup.querySelector('input[data-meas-side="' + side + '"][data-meas-unit="inches"]');
    if (panelFt) panelFt.value = entity.measurements[side].feet || '';
    if (panelIn) panelIn.value = entity.measurements[side].inches || '';
  };

  const save = () => {
    entity.measurements[side] = { feet: fInp.value, inches: iInp.value };
    refresh();
    closeMeasurePopup();
  };
  const clear = () => {
    entity.measurements[side] = { feet: '', inches: '' };
    refresh();
    closeMeasurePopup();
  };

  measurePopup.onmousedown = (ev) => ev.stopPropagation();
  measurePopup.onclick = (ev) => ev.stopPropagation();
  const onKey = (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); save(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); closeMeasurePopup(); }
  };
  fInp.addEventListener('keydown', onKey);
  iInp.addEventListener('keydown', onKey);
  measurePopup.querySelector('button[data-role="save"]').addEventListener('click', save);
  measurePopup.querySelector('button[data-role="clear"]').addEventListener('click', clear);
}

function closeMeasurePopup() {
  measurePopup.style.display = 'none';
  measurePopup.innerHTML = '';
}

// ============= TOOLS =============

function setTool(t) {
  state.tool = t;
  if (state.drawing && (!t || state.drawing.type !== t)) {
    state.drawing = null;
    renderOverlay();
  }
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  canvasEl.classList.toggle('tool-active', !!t);
  if (t) deselect();
}

// ============= COMPASS =============

let compassRotation = 0;
function rotateCompass() {
  compassRotation += 90;
  compassSvg.style.transform = 'rotate(' + compassRotation + 'deg)';
}

// ============= INIT / WIRING =============

// Default sizes for click-to-place items
const PLACE_SIZES = {
  square:    { w: 100, h: 100 },
  rectangle: { w: 160, h: 100 },
  circle:    { w: 100, h: 100 },
  triangle:  { w: 120, h: 100 },
  road:      { w: 200, h: 60 },
  driveway:  { w: 150, h: 50 },
  tree:      { w: 80,  h: 100 },
  bush:      { w: 90,  h: 70 },
  septic:    { w: 160, h: 70 },
  wellhead:  { w: 80,  h: 80 },
};
// Shapes that place unnamed and prompt the user to type a name
const UNNAMED_TYPES = ['square', 'rectangle', 'circle', 'triangle'];

// Successive placements step diagonally so items never stack exactly.
let placeCounter = 0;
function nextPlaceOffset() {
  const i = placeCounter % 6;
  placeCounter++;
  return i * 26;
}

// Place an item (shape type, arrow, or fence) at the centre of the canvas.
function placeFromSidebar(kind) {
  const cs = canvasSize();
  const off = nextPlaceOffset();

  if (kind === 'arrow' || kind === 'fence') {
    const len = 130;
    const cx = cs.w / 2 + off;
    const cy = Math.max(0, Math.min(cs.h, cs.h / 2 + off));
    const x1 = Math.max(0, Math.min(cs.w - len, cx - len / 2));
    const x2 = x1 + len;
    const id = uid();
    if (kind === 'arrow') {
      addArrow({ id, x1, y1: cy, x2, y2: cy, color: '#000000', distance: '', measurements: emptyMeasurements() });
      selectEntity('arrow', id);
    } else {
      addFence({ id, x1, y1: cy, x2, y2: cy, color: '#000000', measurements: emptyMeasurements() });
      selectEntity('fence', id);
    }
    // A freshly placed item opens its panel so it can be configured right away.
    openPanel();
    return;
  }

  const def = PLACE_SIZES[kind];
  if (!def) return;
  const x = Math.max(0, Math.min(cs.w - def.w, (cs.w - def.w) / 2 + off));
  const y = Math.max(0, Math.min(cs.h - def.h, (cs.h - def.h) / 2 + off));
  addShape(kind, x, y, def.w, def.h); // selects the new shape
  // Open the panel so the user can immediately name / configure the new shape.
  openPanel();
}

function init() {
  // Tools & Shapes drawer controls.
  // The menu opens ONLY from a deliberate tap on this hamburger button — nothing
  // else in the app calls openSidebar(). Stop the event here so the tap can never
  // bubble to other handlers (or be confused with a canvas/shape interaction).
  const menuBtn = document.getElementById('menuBtn');
  if (menuBtn) menuBtn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const sb = document.getElementById('sidebar');
    if (sb && sb.classList.contains('open')) closeSidebar();
    else openSidebar();
  });
  const sidebarClose = document.getElementById('sidebarClose');
  if (sidebarClose) sidebarClose.addEventListener('click', closeSidebar);
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  if (sidebarBackdrop) sidebarBackdrop.addEventListener('click', closeSidebar);

  // Sidebar shape cards — click to place at the canvas centre, then close the
  // mobile drawer so the full canvas is visible (no-op on desktop).
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => { placeFromSidebar(card.dataset.shape); closeSidebar(); });
  });

  // Sidebar tool buttons — click to place at the canvas centre, then close drawer
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => { placeFromSidebar(btn.dataset.tool); closeSidebar(); });
  });

  // Fence: tap to set start point, tap again to set end point, then auto-deactivate
  function handleFenceTap(p) {
    if (!state.drawing || state.drawing.type !== 'fence') {
      state.drawing = { type: 'fence', x1: p.x, y1: p.y, x2: p.x, y2: p.y };
      renderOverlay();
    } else {
      const dx = p.x - state.drawing.x1;
      const dy = p.y - state.drawing.y1;
      if (Math.hypot(dx, dy) >= 8) {
        const newId = uid();
        addFence({
          id: newId,
          x1: state.drawing.x1, y1: state.drawing.y1,
          x2: p.x, y2: p.y,
          color: '#000000',
          measurements: emptyMeasurements(),
        });
        state.drawing = null;
        setTool(null);
        selectEntity('fence', newId);
        openPanel();
      } else {
        state.drawing = null;
        renderOverlay();
      }
    }
  }

  // Canvas pointer down — background deselect, fence tap, or start drag-draw
  // (arrow / road / driveway). Works for both mouse and touch.
  function onCanvasDown(e) {
    if (e.type === 'mousedown' && e.button !== 0) return;
    const isTouch = e.type === 'touchstart';
    const p = canvasPoint(e);
    if (state.tool === 'fence') {
      if (isTouch) e.preventDefault();
      handleFenceTap(p);
    } else if (state.tool === 'arrow' || state.tool === 'road' || state.tool === 'driveway') {
      if (isTouch) e.preventDefault();
      state.drawing = { type: state.tool, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
      renderOverlay();
    } else if (state.tool == null) {
      // Background tap → deselect (children stop propagation themselves)
      deselect();
    }
  }
  canvasEl.addEventListener('mousedown', onCanvasDown);
  canvasEl.addEventListener('touchstart', onCanvasDown, { passive: false });

  function onCanvasMove(e) {
    if (!state.drawing || state.drawing.type === 'fence') return;
    if (e.type === 'touchmove' && e.cancelable) e.preventDefault();
    const p = canvasPoint(e);
    state.drawing.x2 = p.x;
    state.drawing.y2 = p.y;
    renderOverlay();
  }
  canvasEl.addEventListener('mousemove', onCanvasMove);
  canvasEl.addEventListener('touchmove', onCanvasMove, { passive: false });

  function onCanvasUp(e) {
    if (!state.drawing) return;
    const d = state.drawing;
    // Fence drawing is tap-driven, not drag-driven — handled in onCanvasDown
    if (d.type === 'fence') return;

    if (d.type === 'arrow') {
      const len = Math.hypot(d.x2 - d.x1, d.y2 - d.y1);
      if (len >= 8) {
        const newId = uid();
        addArrow({
          id: newId,
          x1: d.x1, y1: d.y1, x2: d.x2, y2: d.y2,
          color: '#000000',
          distance: '',
          measurements: emptyMeasurements(),
        });
        // Auto-deactivate the arrow tool and select the new arrow so the user
        // can immediately tweak its distance / colour / measurements.
        setTool(null);
        selectEntity('arrow', newId);
        openPanel();
      }
    } else if (d.type === 'road' || d.type === 'driveway') {
      const dx = Math.abs(d.x2 - d.x1);
      const dy = Math.abs(d.y2 - d.y1);
      // Require some meaningful drag, otherwise treat as accidental tap
      if (dx >= 8 || dy >= 8) {
        const rx = Math.min(d.x1, d.x2);
        const ry = Math.min(d.y1, d.y2);
        let rw = Math.max(MIN_SIZE, dx);
        let rh = Math.max(MIN_SIZE, dy);
        const cs = canvasSize();
        const fx = Math.max(0, Math.min(cs.w - rw, rx));
        const fy = Math.max(0, Math.min(cs.h - rh, ry));
        rw = Math.min(rw, cs.w - fx);
        rh = Math.min(rh, cs.h - fy);
        addShape(d.type, fx, fy, rw, rh);
        openPanel();
      }
    }

    state.drawing = null;
    renderOverlay();
  }
  canvasEl.addEventListener('mouseup', onCanvasUp);
  canvasEl.addEventListener('touchend', onCanvasUp);

  // Compass
  compassBtn.addEventListener('mousedown', (e) => e.stopPropagation());
  compassBtn.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    e.preventDefault();
    rotateCompass();
  }, { passive: false });
  compassBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    rotateCompass();
  });

  // Zoom buttons — work for both mouse clicks and finger taps. stopPropagation
  // keeps a tap on a button from reaching the canvas; preventDefault on
  // touchstart suppresses the synthetic click so each tap fires the action once.
  function wireZoomButton(btn, fn) {
    if (!btn) return;
    btn.addEventListener('mousedown', (e) => e.stopPropagation());
    btn.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      e.preventDefault();
      fn();
    }, { passive: false });
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      fn();
    });
  }
  wireZoomButton(document.getElementById('zoomInBtn'), zoomIn);
  wireZoomButton(document.getElementById('zoomOutBtn'), zoomOut);
  applyZoom(); // set initial transform + "100%" label

  // Keyboard
  window.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;

    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (state.selection) {
        e.preventDefault();
        const { kind, id } = state.selection;
        if (kind === 'shape') deleteShape(id);
        else if (kind === 'arrow') deleteArrow(id);
        else if (kind === 'fence') deleteFence(id);
      }
    } else if (e.key === 'Escape') {
      e.preventDefault();
      const drawer = document.getElementById('blueprintsDrawer');
      const sb = document.getElementById('sidebar');
      if (drawer && drawer.classList.contains('open')) closeBlueprintsDrawer();
      else if (sb && sb.classList.contains('open')) closeSidebar();
      else if (state.drawing) { state.drawing = null; renderOverlay(); }
      else if (state.tool) setTool(null);
      else if (state.selection) deselect();
    }
  });

  // Reposition popup on resize
  window.addEventListener('resize', () => {
    if (state.selection) positionPanel();
  });

  // Save / load blueprint buttons
  const saveBpBtn = document.getElementById('saveBlueprintBtn');
  if (saveBpBtn) saveBpBtn.addEventListener('click', saveBlueprint);
  const myBpBtn = document.getElementById('myBlueprintsBtn');
  if (myBpBtn) myBpBtn.addEventListener('click', openBlueprintsDrawer);
  const bpClose = document.getElementById('blueprintsClose');
  if (bpClose) bpClose.addEventListener('click', closeBlueprintsDrawer);
  const bpBackdrop = document.getElementById('blueprintsBackdrop');
  if (bpBackdrop) bpBackdrop.addEventListener('click', closeBlueprintsDrawer);
  const loadFileBtn = document.getElementById('loadFromFileBtn');
  const fileInput = document.getElementById('blueprintFileInput');
  if (loadFileBtn && fileInput) {
    loadFileBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) importBlueprintFile(file);
      fileInput.value = ''; // allow re-selecting the same file later
    });
  }

  // Save as PDF button — uses jsPDF + html2canvas (loaded from CDN above)
  const savePdfBtn = document.getElementById('savePdfBtn');
  if (savePdfBtn) {
    savePdfBtn.addEventListener('click', async () => {
      if (savePdfBtn.disabled) return;
      if (typeof window.html2canvas !== 'function' || !window.jspdf || !window.jspdf.jsPDF) {
        alert('PDF export libraries failed to load. Please check your internet connection and try again.');
        return;
      }

      const originalHtml = savePdfBtn.innerHTML;
      savePdfBtn.disabled = true;
      savePdfBtn.innerHTML = 'Saving…';

      const pdfPrevZoom = zoom;
      const zoomControlsEl = document.querySelector('.zoom-controls');

      try {
        // Clear selection and any popups so handles / blue rings / floating panels
        // don't get baked into the export.
        deselect();
        closeMeasurePopup();
        // Always capture at 100% zoom (so the full plan fits) and hide the zoom
        // buttons so they aren't baked into the PDF. Both are restored in finally.
        zoomLayerEl.style.transform = 'scale(1)';
        if (zoomControlsEl) zoomControlsEl.style.visibility = 'hidden';
        // Yield one frame so the DOM updates land before we capture.
        await new Promise(r => requestAnimationFrame(r));

        const snapshot = await window.html2canvas(canvasEl, {
          backgroundColor: '#f8fafc',
          scale: 2,
          logging: false,
          useCORS: true,
        });

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: 'landscape',
          unit: 'pt',
          format: 'letter', // 11 x 8.5 in landscape = 792 x 612 pt
        });

        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        const margin = 28; // ~0.39 in on every side
        const contentW = pageW - 2 * margin;
        const contentH = pageH - 2 * margin;
        const imgW = snapshot.width;
        const imgH = snapshot.height;

        // Notes header (skipped entirely if the field is empty)
        const notesEl = document.getElementById('notesTextarea');
        const notesText = ((notesEl && notesEl.value) || '').trim();
        let canvasAreaTop = margin;
        const gapBelowNotes = 10;

        if (notesText) {
          const labelSize = 9;
          const notesSize = 10;
          const lineHeight = 12;
          const labelToText = 6;

          // Wrap notes to fit the printable width
          pdf.setFont('helvetica', 'normal');
          pdf.setFontSize(notesSize);
          const wrapped = pdf.splitTextToSize(notesText, contentW);

          // Cap the notes block at ~40% of available height so the canvas always has room
          const maxNotesH = contentH * 0.4;
          const labelTotal = labelSize + labelToText;
          const maxLines = Math.max(1, Math.floor((maxNotesH - labelTotal) / lineHeight));
          const lines = wrapped.length > maxLines ? wrapped.slice(0, maxLines) : wrapped;

          // "Notes" label
          pdf.setFont('helvetica', 'bold');
          pdf.setFontSize(labelSize);
          pdf.setTextColor(71, 85, 105);
          pdf.text('NOTES', margin, margin, { baseline: 'top' });

          // Notes body
          pdf.setFont('helvetica', 'normal');
          pdf.setFontSize(notesSize);
          pdf.setTextColor(30, 41, 59);
          pdf.text(lines, margin, margin + labelTotal, { baseline: 'top' });

          // Thin separator between notes and canvas
          const blockH = labelTotal + lines.length * lineHeight;
          const sepY = margin + blockH + gapBelowNotes / 2;
          pdf.setDrawColor(203, 213, 225);
          pdf.setLineWidth(0.5);
          pdf.line(margin, sepY, pageW - margin, sepY);

          canvasAreaTop = margin + blockH + gapBelowNotes;
        }

        // Centered canvas in whatever space is left under the notes
        const canvasAreaH = (pageH - margin) - canvasAreaTop;
        const canvasAreaW = contentW;
        const fitScale = Math.min(canvasAreaW / imgW, canvasAreaH / imgH);
        const drawW = imgW * fitScale;
        const drawH = imgH * fitScale;
        const drawX = margin + (canvasAreaW - drawW) / 2;
        const drawY = canvasAreaTop + (canvasAreaH - drawH) / 2;

        pdf.addImage(snapshot.toDataURL('image/png'), 'PNG', drawX, drawY, drawW, drawH);
        pdf.save('blueprint.pdf');
      } catch (err) {
        console.error('PDF export failed:', err);
        alert('PDF export failed: ' + (err && err.message ? err.message : err));
      } finally {
        // Restore the user's zoom level and the zoom buttons.
        zoom = pdfPrevZoom;
        applyZoom();
        if (zoomControlsEl) zoomControlsEl.style.visibility = '';
        savePdfBtn.disabled = false;
        savePdfBtn.innerHTML = originalHtml;
      }
    });
  }

  // Notes textarea — persisted to localStorage
  const notesTa = document.getElementById('notesTextarea');
  if (notesTa) {
    try {
      const saved = localStorage.getItem('blueprint.notes');
      if (saved != null) notesTa.value = saved;
    } catch (_) {}
    notesTa.addEventListener('input', () => {
      try { localStorage.setItem('blueprint.notes', notesTa.value); } catch (_) {}
    });
  }

  loadSavedNames();
  loadCanvas();
  updatePlaceholder();
}

init();
})();
</script>
