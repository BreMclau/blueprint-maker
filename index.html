    if (cancel) apply(0, 0);          // two-finger gesture took over → revert
    else if (moved) persistCanvas();
    else handleItemTap(kind, ent.id); // clean tap → select / double-tap to edit
  };
  const onUp = (ev) => { if (ev.pointerId !== pid) return; finish(false); };
  activeDrag = () => finish(true);
  canvasEl.addEventListener('pointermove', move);
  canvasEl.addEventListener('pointerup', onUp);
  canvasEl.addEventListener('pointercancel', onUp);
}

// Wire a handle's pointerdown to start a drag, AND swallow the legacy mouse/touch
// events so they don't bubble to the canvas (deselect/pan) or the parent shape
// (move). Pointer events drive the interaction; the legacy events are blocked.
function wireHandlePointer(el, startFn) {
  el.addEventListener('pointerdown', startFn);
  el.addEventListener('mousedown', (e) => e.stopPropagation());
  el.addEventListener('touchstart', (e) => { e.stopPropagation(); if (e.cancelable) e.preventDefault(); }, { passive: false });
}

// A draggable endpoint handle (circle) for a selected arrow / fence. Sized in
// screen pixels (counter-scaled against zoom) so it stays >=20px and grabbable.
function makeEndpointHandleSvg(kind, id, which, x, y) {
  const c = document.createElementNS(SVG_NS, 'circle');
  c.classList.add('endpoint-handle');
  if (draggingEndpoint && draggingEndpoint.kind === kind && draggingEndpoint.id === id && draggingEndpoint.which === which) {
    c.classList.add('dragging');
  }
  c.setAttribute('cx', x);
  c.setAttribute('cy', y);
  c.setAttribute('r', 12 / zoom);                 // ~24px diameter on screen
  c.setAttribute('stroke-width', 3 / zoom);
  wireHandlePointer(c, (ev) => { if (!gesture) startEndpointDrag(kind, id, which, ev); });
  return c;
}

// True when a press lands on/near one of an arrow/fence's (visual) endpoints, so
// the very first press can grab and drag that endpoint in a single gesture.
function nearEndpoint(ent, e) {
  const p = canvasPoint(e);
  const mx = (ent.x1 + ent.x2) / 2, my = (ent.y1 + ent.y2) / 2;
  const rad = (ent.rotation || 0) * Math.PI / 180;
  const cos = Math.cos(rad), sin = Math.sin(rad);
  const vis = (x, y) => ({ x: mx + (x - mx) * cos - (y - my) * sin, y: my + (x - mx) * sin + (y - my) * cos });
  const v1 = vis(ent.x1, ent.y1), v2 = vis(ent.x2, ent.y2);
  const grab = 18 / zoom; // forgiving grab radius in content units
  if (Math.hypot(p.x - v1.x, p.y - v1.y) <= grab) return 'start';
  if (Math.hypot(p.x - v2.x, p.y - v2.y) <= grab) return 'end';
  return null;
}

// ============= ARROWS / ROADS =============

function addArrow(a) {
  if (typeof a.layer !== 'number') a.layer = LAYER_DEFAULTS.arrow;
  if (typeof a.seq !== 'number') a.seq = nextSeq();
  if (typeof a.rotation !== 'number') a.rotation = 0;
  state.arrows.push(a); renderOverlay(); updatePlaceholder();
}
function deleteArrow(id) {
  state.arrows = state.arrows.filter(a => a.id !== id);
  if (state.selection && state.selection.kind === 'arrow' && state.selection.id === id) deselect();
  renderOverlay();
  updatePlaceholder();
}

function addFence(f) {
  if (typeof f.layer !== 'number') f.layer = LAYER_DEFAULTS.fence;
  if (typeof f.seq !== 'number') f.seq = nextSeq();
  if (typeof f.rotation !== 'number') f.rotation = 0;
  state.fences.push(f); renderOverlay(); updatePlaceholder();
}
function deleteFence(id) {
  state.fences = state.fences.filter(f => f.id !== id);
  if (state.selection && state.selection.kind === 'fence' && state.selection.id === id) deselect();
  renderOverlay();
  updatePlaceholder();
}

// Small "Edit" button drawn at the midpoint of a selected arrow / fence. Tapping
// it opens the info panel (mirrors the centered Edit button on shapes).
function makeSvgEditButton(cx, cy) {
  const g = document.createElementNS(SVG_NS, 'g');
  g.classList.add('edit-btn-svg');
  g.style.cursor = 'pointer';
  const rw = 46, rh = 24;
  const rect = document.createElementNS(SVG_NS, 'rect');
  rect.setAttribute('x', cx - rw / 2);
  rect.setAttribute('y', cy - rh / 2);
  rect.setAttribute('width', rw);
  rect.setAttribute('height', rh);
  rect.setAttribute('rx', 6);
  rect.setAttribute('fill', '#1e293b');
  rect.setAttribute('stroke', '#ffffff');
  rect.setAttribute('stroke-width', '1');
  g.appendChild(rect);
  const t = document.createElementNS(SVG_NS, 'text');
  t.setAttribute('x', cx);
  t.setAttribute('y', cy + 1);
  t.setAttribute('text-anchor', 'middle');
  t.setAttribute('dominant-baseline', 'middle');
  t.setAttribute('fill', '#ffffff');
  t.setAttribute('font-size', '12');
  t.setAttribute('font-weight', '700');
  t.style.pointerEvents = 'none';
  t.textContent = 'Edit';
  g.appendChild(t);
  const open = (e) => { e.stopPropagation(); e.preventDefault(); openPanel(); };
  g.addEventListener('mousedown', (e) => e.stopPropagation());
  g.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); }, { passive: false });
  g.addEventListener('click', open);
  g.addEventListener('touchend', open);
  return g;
}

// Rotate handle drawn above the midpoint of a selected arrow / fence: a short
// connector line up to a circular-arrow button. Dragging it spins the item.
function makeRotateHandleSvg(kind, id, cx, cy) {
  const dist = 36, hx = cx, hy = cy - dist;
  const g = document.createElementNS(SVG_NS, 'g');
  g.classList.add('rotate-handle-svg');
  g.style.cursor = 'grab';
  const ln = document.createElementNS(SVG_NS, 'line');
  ln.setAttribute('x1', cx); ln.setAttribute('y1', cy);
  ln.setAttribute('x2', hx); ln.setAttribute('y2', hy);
  ln.setAttribute('stroke', '#3b82f6'); ln.setAttribute('stroke-width', '2');
  ln.style.pointerEvents = 'none';
  g.appendChild(ln);
  const c = document.createElementNS(SVG_NS, 'circle');
  c.setAttribute('cx', hx); c.setAttribute('cy', hy); c.setAttribute('r', 12);
  c.setAttribute('fill', '#3b82f6'); c.setAttribute('stroke', '#ffffff'); c.setAttribute('stroke-width', '2');
  g.appendChild(c);
  const t = document.createElementNS(SVG_NS, 'text');
  t.setAttribute('x', hx); t.setAttribute('y', hy + 1);
  t.setAttribute('text-anchor', 'middle'); t.setAttribute('dominant-baseline', 'middle');
  t.setAttribute('fill', '#ffffff'); t.setAttribute('font-size', '16'); t.setAttribute('font-weight', '700');
  t.style.pointerEvents = 'none';
  t.textContent = '↻';
  g.appendChild(t);
  wireHandlePointer(g, (ev) => { if (!gesture) startRotate(kind, id, ev); });
  return g;
}

function renderOverlay() {
  // Each arrow / fence is rendered as its own positioned SVG so it can take a
  // real z-index and interleave with the shape layers.
  canvasEl.querySelectorAll('.ov-item').forEach(n => n.remove());

  // Fences (dashed line, no arrowhead)
  for (const f of state.fences) {
    const isSel = state.selection && state.selection.kind === 'fence' && state.selection.id === f.id;
    const g = document.createElementNS(SVG_NS, 'svg');
    g.classList.add('ov-item');
    g.style.zIndex = String(zIndexOf(f, 'fence'));

    if (isSel) {
      const halo = document.createElementNS(SVG_NS, 'line');
      halo.setAttribute('x1', f.x1); halo.setAttribute('y1', f.y1);
      halo.setAttribute('x2', f.x2); halo.setAttribute('y2', f.y2);
      halo.setAttribute('stroke', '#3b82f6');
      halo.setAttribute('stroke-width', '9');
      halo.setAttribute('stroke-linecap', 'round');
      halo.setAttribute('opacity', '0.4');
      halo.style.pointerEvents = 'none';
      g.appendChild(halo);
    }

    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', f.x1); line.setAttribute('y1', f.y1);
    line.setAttribute('x2', f.x2); line.setAttribute('y2', f.y2);
    line.setAttribute('stroke', f.color || '#000000');
    line.setAttribute('stroke-width', '3');
    line.setAttribute('stroke-linecap', 'round');
    line.setAttribute('stroke-dasharray', '6 5');
    line.style.pointerEvents = 'none';
    g.appendChild(line);

    const hit = document.createElementNS(SVG_NS, 'line');
    hit.classList.add('fence-hit');
    hit.setAttribute('x1', f.x1); hit.setAttribute('y1', f.y1);
    hit.setAttribute('x2', f.x2); hit.setAttribute('y2', f.y2);
    hit.setAttribute('stroke', 'transparent');
    hit.setAttribute('stroke-width', '14');
    const onFenceStart = (e) => {
      if (gesture) return; // a two-finger gesture owns the touch
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      // One press, no waiting: pressing an end grabs that endpoint; selection is
      // immediate so every handle is live at once.
      const which = nearEndpoint(f, e);
      if (!isSelected('fence', f.id)) selectEntity('fence', f.id);
      if (which) { startEndpointDrag('fence', f.id, which, e); return; }
      startLineMove('fence', f, e);
    };
    wireHandlePointer(hit, onFenceStart);
    g.appendChild(hit);

    // Auto "Fence" label, just above the midpoint of the line
    const fLabel = document.createElementNS(SVG_NS, 'text');
    fLabel.setAttribute('x', (f.x1 + f.x2) / 2);
    fLabel.setAttribute('y', (f.y1 + f.y2) / 2 - 8);
    fLabel.setAttribute('text-anchor', 'middle');
    fLabel.setAttribute('font-size', '12');
    fLabel.setAttribute('font-weight', '600');
    fLabel.setAttribute('fill', '#334155');
    fLabel.setAttribute('stroke', 'white');
    fLabel.setAttribute('stroke-width', '3');
    fLabel.setAttribute('paint-order', 'stroke');
    fLabel.style.pointerEvents = 'none';
    fLabel.textContent = 'Fence';
    g.appendChild(fLabel);

    // Padded bbox for clickable / labelable edges (handles axis-aligned fences)
    const ms = f.measurements || emptyMeasurements();
    const bx = Math.min(f.x1, f.x2);
    const by = Math.min(f.y1, f.y2);
    const bw = Math.abs(f.x2 - f.x1);
    const bh = Math.abs(f.y2 - f.y1);
    const minDim = 24;
    const padX = Math.max(0, (minDim - bw) / 2);
    const padY = Math.max(0, (minDim - bh) / 2);
    const pbx = bx - padX, pby = by - padY;
    const pbw = bw + 2 * padX, pbh = bh + 2 * padY;

    const labelSpec = {
      top:    { lx: pbx + pbw / 2, ly: pby - 6, anchor: 'middle' },
      right:  { lx: pbx + pbw + 6, ly: pby + pbh / 2 + 4, anchor: 'start' },
      bottom: { lx: pbx + pbw / 2, ly: pby + pbh + 16, anchor: 'middle' },
      left:   { lx: pbx - 6, ly: pby + pbh / 2 + 4, anchor: 'end' },
    };
    for (const side of ['top','right','bottom','left']) {
      const v = formatMeasurement(ms[side]);
      if (!v) continue;
      const spec = labelSpec[side];
      const text = document.createElementNS(SVG_NS, 'text');
      text.setAttribute('x', spec.lx);
      text.setAttribute('y', spec.ly);
      text.setAttribute('text-anchor', spec.anchor);
      text.setAttribute('font-size', '11');
      text.setAttribute('font-weight', '500');
      text.setAttribute('fill', '#334155');
      text.setAttribute('stroke', 'white');
      text.setAttribute('stroke-width', '3');
      text.setAttribute('paint-order', 'stroke');
      text.style.pointerEvents = 'none';
      text.textContent = v;
      g.appendChild(text);
    }

    if (isSel && state.editing) {
      const edges = [
        { side: 'top',    x: pbx,        y: pby - 10,   w: pbw, h: 10 },
        { side: 'right',  x: pbx + pbw,  y: pby,        w: 10,  h: pbh },
        { side: 'bottom', x: pbx,        y: pby + pbh,  w: pbw, h: 10 },
        { side: 'left',   x: pbx - 10,   y: pby,        w: 10,  h: pbh },
      ];
      for (const ed of edges) {
        const s = document.createElementNS(SVG_NS, 'rect');
        s.classList.add('edge-strip-arrow');
        s.setAttribute('x', ed.x);
        s.setAttribute('y', ed.y);
        s.setAttribute('width', ed.w);
        s.setAttribute('height', ed.h);
        s.addEventListener('mousedown', (e) => e.stopPropagation());
        const openF = (e) => {
          e.stopPropagation();
          if (e.type === 'touchend') e.preventDefault();
          openMeasurePopup(f, ed.side, e, 'fence');
        };
        s.addEventListener('click', openF);
        s.addEventListener('touchend', openF);
        g.appendChild(s);
      }
    }

    // Rotate handle + Edit button + draggable endpoint handles when selected.
    if (isSel) {
      g.appendChild(makeRotateHandleSvg('fence', f.id, (f.x1 + f.x2) / 2, (f.y1 + f.y2) / 2));
      g.appendChild(makeSvgEditButton((f.x1 + f.x2) / 2, (f.y1 + f.y2) / 2));
      g.appendChild(makeEndpointHandleSvg('fence', f.id, 'start', f.x1, f.y1));
      g.appendChild(makeEndpointHandleSvg('fence', f.id, 'end', f.x2, f.y2));
    }
    // Apply the saved rotation about the line's midpoint (handle + content spin together).
    if (f.rotation) {
      const mx = (f.x1 + f.x2) / 2, my = (f.y1 + f.y2) / 2;
      g.style.transformOrigin = mx + 'px ' + my + 'px';
      g.style.transform = 'rotate(' + f.rotation + 'deg)';
    }

    zoomLayerEl.appendChild(g);
  }

  // Arrows
  for (const a of state.arrows) {
    const isSel = state.selection && state.selection.kind === 'arrow' && state.selection.id === a.id;
    const g = document.createElementNS(SVG_NS, 'svg');
    g.classList.add('ov-item');
    g.style.zIndex = String(zIndexOf(a, 'arrow'));

    if (isSel) {
      const halo = document.createElementNS(SVG_NS, 'line');
      halo.setAttribute('x1', a.x1); halo.setAttribute('y1', a.y1);
      halo.setAttribute('x2', a.x2); halo.setAttribute('y2', a.y2);
      halo.setAttribute('stroke', '#3b82f6');
      halo.setAttribute('stroke-width', '9');
      halo.setAttribute('stroke-linecap', 'round');
      halo.setAttribute('opacity', '0.4');
      halo.style.pointerEvents = 'none';
      g.appendChild(halo);
    }

    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', a.x1); line.setAttribute('y1', a.y1);
    line.setAttribute('x2', a.x2); line.setAttribute('y2', a.y2);
    line.setAttribute('stroke', a.color);
    line.setAttribute('stroke-width', '3');
    line.setAttribute('stroke-linecap', 'round');
    line.style.pointerEvents = 'none';
    g.appendChild(line);

    // Arrowhead drawn as a filled triangle (self-contained in this SVG)
    const ang = Math.atan2(a.y2 - a.y1, a.x2 - a.x1);
    const headLen = 13, headW = 7;
    const hbx1 = a.x2 - headLen * Math.cos(ang) + headW * Math.sin(ang);
    const hby1 = a.y2 - headLen * Math.sin(ang) - headW * Math.cos(ang);
    const hbx2 = a.x2 - headLen * Math.cos(ang) - headW * Math.sin(ang);
    const hby2 = a.y2 - headLen * Math.sin(ang) + headW * Math.cos(ang);
    const head = document.createElementNS(SVG_NS, 'polygon');
    head.setAttribute('points', a.x2 + ',' + a.y2 + ' ' + hbx1 + ',' + hby1 + ' ' + hbx2 + ',' + hby2);
    head.setAttribute('fill', a.color);
    head.style.pointerEvents = 'none';
    g.appendChild(head);

    const hit = document.createElementNS(SVG_NS, 'line');
    hit.classList.add('arrow-hit');
    hit.setAttribute('x1', a.x1); hit.setAttribute('y1', a.y1);
    hit.setAttribute('x2', a.x2); hit.setAttribute('y2', a.y2);
    hit.setAttribute('stroke', 'transparent');
    hit.setAttribute('stroke-width', '14');
    const onArrowStart = (e) => {
      if (gesture) return; // a two-finger gesture owns the touch
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      // One press, no waiting: pressing an end grabs that endpoint; selection is
      // immediate so every handle is live at once.
      const which = nearEndpoint(a, e);
      if (!isSelected('arrow', a.id)) selectEntity('arrow', a.id);
      if (which) { startEndpointDrag('arrow', a.id, which, e); return; }
      startLineMove('arrow', a, e);
    };
    wireHandlePointer(hit, onArrowStart);
    g.appendChild(hit);

    // Distance label centered at the arrow midpoint
    if (a.distance) {
      const mx = (a.x1 + a.x2) / 2;
      const my = (a.y1 + a.y2) / 2;
      const dt = document.createElementNS(SVG_NS, 'text');
      dt.setAttribute('x', mx);
      dt.setAttribute('y', my);
      dt.setAttribute('text-anchor', 'middle');
      dt.setAttribute('dominant-baseline', 'middle');
      dt.setAttribute('font-size', '12');
      dt.setAttribute('font-weight', '600');
      dt.setAttribute('fill', '#1e293b');
      dt.setAttribute('stroke', 'white');
      dt.setAttribute('stroke-width', '4');
      dt.setAttribute('paint-order', 'stroke');
      dt.style.pointerEvents = 'none';
      dt.textContent = a.distance;
      g.appendChild(dt);
    }

    // Padded bbox (so axis-aligned arrows still get clickable / labelable edges)
    const ms = a.measurements || { top: '', right: '', bottom: '', left: '' };
    const bx = Math.min(a.x1, a.x2);
    const by = Math.min(a.y1, a.y2);
    const bw = Math.abs(a.x2 - a.x1);
    const bh = Math.abs(a.y2 - a.y1);
    const minDim = 24;
    const padX = Math.max(0, (minDim - bw) / 2);
    const padY = Math.max(0, (minDim - bh) / 2);
    const pbx = bx - padX, pby = by - padY;
    const pbw = bw + 2 * padX, pbh = bh + 2 * padY;

    // Measurement labels (always shown when set)
    const labelSpec = {
      top:    { lx: pbx + pbw / 2,   ly: pby - 6,        anchor: 'middle' },
      right:  { lx: pbx + pbw + 6,   ly: pby + pbh / 2 + 4, anchor: 'start' },
      bottom: { lx: pbx + pbw / 2,   ly: pby + pbh + 16,  anchor: 'middle' },
      left:   { lx: pbx - 6,         ly: pby + pbh / 2 + 4, anchor: 'end' },
    };
    for (const side of ['top','right','bottom','left']) {
      const v = formatMeasurement(ms[side]);
      if (!v) continue;
      const spec = labelSpec[side];
      const text = document.createElementNS(SVG_NS, 'text');
      text.setAttribute('x', spec.lx);
      text.setAttribute('y', spec.ly);
      text.setAttribute('text-anchor', spec.anchor);
      text.setAttribute('font-size', '11');
      text.setAttribute('font-weight', '500');
      text.setAttribute('fill', '#334155');
      text.setAttribute('stroke', 'white');
      text.setAttribute('stroke-width', '3');
      text.setAttribute('paint-order', 'stroke');
      text.style.pointerEvents = 'none';
      text.textContent = v;
      g.appendChild(text);
    }

    // Edge measurement strips (only when arrow is selected AND in edit mode)
    if (isSel && state.editing) {
      const edges = [
        { side: 'top',    x: pbx,        y: pby - 10,   w: pbw, h: 10 },
        { side: 'right',  x: pbx + pbw,  y: pby,        w: 10,  h: pbh },
        { side: 'bottom', x: pbx,        y: pby + pbh,  w: pbw, h: 10 },
        { side: 'left',   x: pbx - 10,   y: pby,        w: 10,  h: pbh },
      ];
      for (const ed of edges) {
        const s = document.createElementNS(SVG_NS, 'rect');
        s.classList.add('edge-strip-arrow');
        s.setAttribute('x', ed.x);
        s.setAttribute('y', ed.y);
        s.setAttribute('width', ed.w);
        s.setAttribute('height', ed.h);
        s.addEventListener('mousedown', (e) => e.stopPropagation());
        const openA = (e) => {
          e.stopPropagation();
          if (e.type === 'touchend') e.preventDefault();
          openMeasurePopup(a, ed.side, e, 'arrow');
        };
        s.addEventListener('click', openA);
        s.addEventListener('touchend', openA);
        g.appendChild(s);
      }
    }

    // Rotate handle + Edit button + draggable endpoint handles when selected.
    if (isSel) {
      g.appendChild(makeRotateHandleSvg('arrow', a.id, (a.x1 + a.x2) / 2, (a.y1 + a.y2) / 2));
      g.appendChild(makeSvgEditButton((a.x1 + a.x2) / 2, (a.y1 + a.y2) / 2));
      g.appendChild(makeEndpointHandleSvg('arrow', a.id, 'start', a.x1, a.y1));
      g.appendChild(makeEndpointHandleSvg('arrow', a.id, 'end', a.x2, a.y2));
    }
    // Apply the saved rotation about the line's midpoint (handle + content spin together).
    if (a.rotation) {
      const mx = (a.x1 + a.x2) / 2, my = (a.y1 + a.y2) / 2;
      g.style.transformOrigin = mx + 'px ' + my + 'px';
      g.style.transform = 'rotate(' + a.rotation + 'deg)';
    }

    zoomLayerEl.appendChild(g);
  }

  // Live drawing preview (unused after click-to-place; kept harmless)
  ovDrawing.innerHTML = '';
  const d = state.drawing;
  if (d && d.type === 'arrow') {
    const ln = document.createElementNS(SVG_NS, 'line');
    ln.setAttribute('x1', d.x1); ln.setAttribute('y1', d.y1);
    ln.setAttribute('x2', d.x2); ln.setAttribute('y2', d.y2);
    ln.setAttribute('stroke', '#1e293b');
    ln.setAttribute('stroke-width', '3');
    ln.setAttribute('stroke-linecap', 'round');
    ln.setAttribute('marker-end', 'url(#ah-000000)');
    ln.setAttribute('opacity', '0.7');
    ovDrawing.appendChild(ln);
  } else if (d && d.type === 'fence') {
    const ln = document.createElementNS(SVG_NS, 'line');
    ln.setAttribute('x1', d.x1); ln.setAttribute('y1', d.y1);
    ln.setAttribute('x2', d.x2); ln.setAttribute('y2', d.y2);
    ln.setAttribute('stroke', '#1e293b');
    ln.setAttribute('stroke-width', '3');
    ln.setAttribute('stroke-linecap', 'round');
    ln.setAttribute('stroke-dasharray', '6 5');
    ln.setAttribute('opacity', '0.6');
    ovDrawing.appendChild(ln);
    const startDot = document.createElementNS(SVG_NS, 'circle');
    startDot.setAttribute('cx', d.x1);
    startDot.setAttribute('cy', d.y1);
    startDot.setAttribute('r', '4');
    startDot.setAttribute('fill', '#3b82f6');
    startDot.setAttribute('stroke', 'white');
    startDot.setAttribute('stroke-width', '2');
    ovDrawing.appendChild(startDot);
  } else if (d && (d.type === 'road' || d.type === 'driveway')) {
    const x = Math.min(d.x1, d.x2);
    const y = Math.min(d.y1, d.y2);
    const w = Math.abs(d.x2 - d.x1);
    const h = Math.abs(d.y2 - d.y1);
    if (w > 0 || h > 0) {
      const rect = document.createElementNS(SVG_NS, 'rect');
      rect.setAttribute('x', x);
      rect.setAttribute('y', y);
      rect.setAttribute('width', w);
      rect.setAttribute('height', h);
      rect.setAttribute('fill', 'rgba(59,130,246,0.12)');
      rect.setAttribute('stroke', '#3b82f6');
      rect.setAttribute('stroke-width', '2');
      rect.setAttribute('stroke-dasharray', '5 4');
      ovDrawing.appendChild(rect);
    }
  }
}

// ============= SELECTION =============

// Select an item: shows its resize handles + centered Edit button, but does NOT
// open the info panel (panelOpen stays false). The panel opens only via openPanel().
function selectEntity(kind, id) {
  closeMeasurePopup();
  state.editing = false;
  state.panelOpen = false;
  state.selection = { kind, id };
  if (kind === 'shape') {
    state.zOrder = state.zOrder.filter(x => x !== id);
    state.zOrder.push(id);
  }
  for (const sh of state.shapes) applyShapeVisual(sh);
  renderOverlay();
  renderPanel();
}

// Open the info panel for the current selection (Edit button or double-tap).
// Opens directly in editable mode so the user can change name/color/etc.
function openPanel() {
  if (!state.selection) return;
  state.panelOpen = true;
  state.editing = true;
  for (const sh of state.shapes) applyShapeVisual(sh);
  renderOverlay();
  renderPanel();
  positionPanel();
}

function deselect() {
  state.selection = null;
  state.editing = false;
  state.panelOpen = false;
  closeMeasurePopup();
  for (const sh of state.shapes) applyShapeVisual(sh);
  renderOverlay();
  renderPanel();
}

// ============= ENTITY PANEL =============

function renderPanel() {
  // The panel is shown only when an item is selected AND the panel was opened
  // (via the Edit button or a double-tap). A plain selection keeps it hidden.
  if (!state.selection || !state.panelOpen) {
    entityPopup.style.display = 'none';
    entityPopup.innerHTML = '';
    return;
  }
  const sel = state.selection;
  const isEditing = !!state.editing;
  // The bottom action row shows Save in edit mode, Edit in read-only mode
  const editOrSaveRow = isEditing
    ? '<div class="row"><button class="primary" data-role="save" type="button">Save</button></div>'
    : '<div class="row"><button class="primary" data-role="edit" type="button">Edit</button></div>';
  let html = '';
  if (sel.kind === 'shape') {
    const sh = state.shapes.find(s => s.id === sel.id);
    if (!sh) { entityPopup.style.display = 'none'; return; }
    const swatches = '<div class="swatches">' +
      COLORS.map(c => '<button type="button" class="swatch ' + (sh.color === c ? 'sel' : '') + '" data-color="' + c + '" style="background:' + c + '"></button>').join('') +
      '</div>';
    const saveRow = editOrSaveRow;
    if (sh.type === 'driveway' || sh.type === 'road') {
      // Auto-named pill/strip: fixed header label + colors + Delete + Save
      // (no name input, no Edit toggle, no Duplicate)
      const label = sh.type === 'driveway' ? 'Driveway' : 'Road';
      html =
        '<div class="entity-label">' + label + '</div>' +
        '<div class="title">Name</div>' +
        '<input type="text" data-role="name" value="' + escHtml(sh.name) + '" placeholder="' + label + '" autocomplete="off">' +
        '<div class="title" style="margin-top:12px;">Color</div>' + swatches +
        sizeBlockHtml(sh) +
        '<div class="row">' +
          '<button class="danger" data-role="delete" type="button">Delete</button>' +
          '<button class="primary" data-role="save" type="button">Save</button>' +
        '</div>';
    } else if (sh.type === 'room') {
      // Interior room — name + size + delete (always editable).
      html =
        '<div class="entity-label">Room</div>' +
        '<div class="title">Name</div>' +
        '<input type="text" data-role="name" value="' + escHtml(sh.name) + '" placeholder="Room (e.g. Kitchen)" autocomplete="off">' +
        sizeBlockHtml(sh) +
        '<div class="row">' +
          '<button class="danger" data-role="delete" type="button">Delete</button>' +
          '<button class="primary" data-role="save" type="button">Save</button>' +
        '</div>';
    } else if (sh.type === 'tree' || sh.type === 'bush') {
      // Tree / Bush — minimal panel: size + a Delete button.
      // The 8 resize handles are always on (rendered by rebuildSelectionAccessories).
      html =
        sizeBlockHtml(sh) +
        '<div class="row">' +
          '<button class="danger" data-role="delete" type="button">Delete</button>' +
        '</div>';
    } else if (sh.type === 'septic' || sh.type === 'wellhead') {
      // Fixed-label utility shapes — always editable: colors + size + measurements +
      // Duplicate + Delete + Save (no Edit toggle).
      const label = sh.type === 'septic' ? 'Septic Tank' : 'Well Head';
      html =
        '<div class="entity-label">' + label + '</div>' +
        '<div class="title">Color</div>' + swatches +
        sizeBlockHtml(sh) +
        measurementsBlockHtml(sh.measurements) +
        '<div class="row">' +
          '<button data-role="duplicate" type="button">Duplicate</button>' +
          '<button class="danger" data-role="delete" type="button">Delete</button>' +
        '</div>' +
        '<div class="row">' +
          '<button class="primary" data-role="save" type="button">Save</button>' +
        '</div>';
    } else {
      // Regular shapes (square/rectangle/circle/triangle) — name + size + measurements.
      // Squares & rectangles can also hold interior rooms.
      const roomParent = sh.type === 'square' || sh.type === 'rectangle';
      html =
        '<div class="title">Name</div>' +
        '<input type="text" data-role="name" value="' + escHtml(sh.name) + '" placeholder="Untitled" autocomplete="off">' +
        '<div class="name-chips" data-role="chips"></div>' +
        '<div class="title" style="margin-top:12px;">Color</div>' + swatches +
        sizeBlockHtml(sh) +
        measurementsBlockHtml(sh.measurements) +
        (roomParent
          ? '<div class="title" style="margin-top:12px;">Add Room</div>' +
            '<div class="row">' +
              '<button data-role="add-room-square" type="button">Square Room</button>' +
              '<button data-role="add-room-rect" type="button">Rectangle Room</button>' +
            '</div>'
          : '') +
        '<div class="row">' +
          '<button data-role="duplicate" type="button">Duplicate</button>' +
        '</div>' +
        saveRow;
    }
  } else if (sel.kind === 'arrow') {
    const a = state.arrows.find(x => x.id === sel.id);
    if (!a) { entityPopup.style.display = 'none'; return; }
    html =
      '<div class="title">Color</div>' +
      '<div class="swatches">' +
        COLORS.map(c => '<button type="button" class="swatch ' + (a.color === c ? 'sel' : '') + '" data-color="' + c + '" style="background:' + c + '"></button>').join('') +
      '</div>' +
      '<div class="title" style="margin-top:12px;">Distance</div>' +
      '<input type="text" data-role="arrow-distance" value="' + escHtml(a.distance || '') + '" placeholder="e.g. 50 ft" autocomplete="off">' +
      measurementsBlockHtml(a.measurements) +
      '<div class="row">' +
        '<button data-role="duplicate" type="button">Duplicate</button>' +
        '<button class="danger" data-role="delete" type="button">Delete</button>' +
      '</div>' +
      editOrSaveRow;
  } else if (sel.kind === 'fence') {
    const f = state.fences.find(x => x.id === sel.id);
    if (!f) { entityPopup.style.display = 'none'; return; }
    const rawAngle = Math.atan2(f.y2 - f.y1, f.x2 - f.x1) * 180 / Math.PI;
    const angleDeg = Math.round(((rawAngle % 360) + 360) % 360);
    html =
      '<div class="title">Color</div>' +
      '<div class="swatches">' +
        COLORS.map(c => '<button type="button" class="swatch ' + (f.color === c ? 'sel' : '') + '" data-color="' + c + '" style="background:' + c + '"></button>').join('') +
      '</div>' +
      '<div class="title" style="margin-top:12px;">Rotation</div>' +
      '<div class="slider-row">' +
        '<input type="range" data-role="fence-rotation" min="0" max="359" value="' + angleDeg + '">' +
        '<span class="lbl" data-role="fence-rotation-val">' + angleDeg + '°</span>' +
      '</div>' +
      measurementsBlockHtml(f.measurements) +
      '<div class="row">' +
        '<button class="danger" data-role="delete" type="button">Delete</button>' +
      '</div>' +
      editOrSaveRow;
  }
  // Opacity slider — basic shapes only (Square / Rectangle / Circle / Triangle)
  const selSh = sel.kind === 'shape' ? state.shapes.find(s => s.id === sel.id) : null;
  if (selSh && OPACITY_SHAPE_TYPES.includes(selSh.type)) {
    const pct = Math.round((selSh.opacity != null ? selSh.opacity : 1) * 100);
    html +=
      '<div class="title" style="margin-top:12px;">Opacity</div>' +
      '<div class="slider-row">' +
        '<input type="range" data-role="opacity" min="20" max="100" value="' + pct + '">' +
        '<span class="lbl" data-role="opacity-val">' + pct + '%</span>' +
      '</div>';
  }

  // Layer controls — every item gets Bring Up / Send Down
  html +=
    '<div class="title" style="margin-top:12px;">Layer</div>' +
    '<div class="row" style="justify-content:flex-start;">' +
      '<button data-role="send-down" type="button">&#9660; Send Down</button>' +
      '<button data-role="bring-up" type="button">&#9650; Bring Up</button>' +
    '</div>';

  entityPopup.innerHTML = html;
  entityPopup.classList.toggle('readonly', !shouldUnlockPanel());
  entityPopup.style.display = 'block';
  positionPanel();
  wirePanel();
}

function wirePanel() {
  entityPopup.onmousedown = (e) => e.stopPropagation();
  entityPopup.onclick = (e) => e.stopPropagation();

  const sel = state.selection;
  if (!sel) return;

  // Name input + saved-name chips (shape)
  const nameInput = entityPopup.querySelector('input[data-role="name"]');
  if (nameInput) {
    const renderChips = () => {
      const chipsEl = entityPopup.querySelector('[data-role="chips"]');
      if (!chipsEl) return;
      chipsEl.innerHTML = '';
      const top = topNames(5);
      for (const n of top) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'name-chip';
        b.textContent = n;
        b.addEventListener('click', () => useChip(n));
        chipsEl.appendChild(b);
      }
    };
    const tryRecord = () => {
      const v = (nameInput.value || '').trim();
      const orig = nameInput.dataset.original || '';
      if (v && v !== orig) {
        recordName(v);
        nameInput.dataset.original = v;
        renderChips();
      }
    };
    const useChip = (name) => {
      nameInput.value = name;
      const sh = state.shapes.find(s => s.id === sel.id);
      if (sh) {
        sh.name = name;
        const el = shapeEls.get(sh.id);
        if (el) el.querySelector('.shape-name').textContent = displayNameFor(sh);
      }
      tryRecord();
    };
    nameInput.addEventListener('focus', () => {
      nameInput.dataset.original = nameInput.value;
    });
    nameInput.addEventListener('input', () => {
      const sh = state.shapes.find(s => s.id === sel.id);
      if (!sh) return;
      sh.name = nameInput.value;
      const el = shapeEls.get(sh.id);
      if (el) el.querySelector('.shape-name').textContent = displayNameFor(sh);
    });
    nameInput.addEventListener('blur', tryRecord);
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); tryRecord(); nameInput.blur(); }
      else if (e.key === 'Escape') { e.preventDefault(); nameInput.blur(); }
    });
    renderChips();
  }

  // Color swatches
  entityPopup.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      const c = sw.dataset.color;
      if (sel.kind === 'shape') {
        const sh = state.shapes.find(s => s.id === sel.id);
        if (sh) { sh.color = c; applyShapeVisual(sh); }
      } else if (sel.kind === 'arrow') {
        const a = state.arrows.find(x => x.id === sel.id);
        if (a) { a.color = c; renderOverlay(); }
      } else if (sel.kind === 'fence') {
        const f = state.fences.find(x => x.id === sel.id);
        if (f) { f.color = c; renderOverlay(); }
      }
      entityPopup.querySelectorAll('.swatch').forEach(s => s.classList.toggle('sel', s.dataset.color === c));
    });
  });

  // Delete (arrow, fence, or road/driveway shape — regular shapes use the corner button)
  const delBtn = entityPopup.querySelector('button[data-role="delete"]');
  if (delBtn) {
    delBtn.addEventListener('click', () => {
      if (sel.kind === 'arrow') deleteArrow(sel.id);
      else if (sel.kind === 'fence') deleteFence(sel.id);
      else if (sel.kind === 'shape') deleteShape(sel.id);
    });
  }

  // Duplicate (any selectable item)
  const dupBtn = entityPopup.querySelector('button[data-role="duplicate"]');
  if (dupBtn) {
    dupBtn.addEventListener('click', () => {
      if (sel.kind === 'shape') duplicateShape(sel.id);
      else if (sel.kind === 'arrow') duplicateArrow(sel.id);
    });
  }

  // Add Room — place an interior room inside this square/rectangle.
  const addRoomSq = entityPopup.querySelector('button[data-role="add-room-square"]');
  if (addRoomSq) addRoomSq.addEventListener('click', () => addRoom(sel.id, 'square'));
  const addRoomRect = entityPopup.querySelector('button[data-role="add-room-rect"]');
  if (addRoomRect) addRoomRect.addEventListener('click', () => addRoom(sel.id, 'rectangle'));

  // Save — persists the entire canvas state and closes the panel
  const saveBtn = entityPopup.querySelector('button[data-role="save"]');
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      persistCanvas();
      deselect();
    });
  }

  // Edit — unlocks the panel inputs and shows resize handles / edge strips
  const editBtn = entityPopup.querySelector('button[data-role="edit"]');
  if (editBtn) {
    editBtn.addEventListener('click', () => {
      state.editing = true;
      renderPanel();
      // Refresh per-entity visual accessories so handles + strips appear
      if (sel.kind === 'shape') {
        const sh = state.shapes.find(s => s.id === sel.id);
        if (sh) applyShapeVisual(sh);
      }
      renderOverlay();
    });
  }

  // Fence rotation slider (edit mode only — disabled handles the read-only case)
  const rotInput = entityPopup.querySelector('input[data-role="fence-rotation"]');
  if (rotInput) {
    const rotLbl = entityPopup.querySelector('[data-role="fence-rotation-val"]');
    rotInput.addEventListener('input', () => {
      const f = state.fences.find(x => x.id === sel.id);
      if (!f) return;
      const angleDeg = parseInt(rotInput.value, 10) || 0;
      rotateFence(f, angleDeg);
      if (rotLbl) rotLbl.textContent = angleDeg + '°';
      renderOverlay();
      positionPanel();
    });
  }

  // Layer controls — Bring Up / Send Down (every item, always active)
  const buBtn = entityPopup.querySelector('button[data-role="bring-up"]');
  if (buBtn) buBtn.addEventListener('click', () => changeLayer(1));
  const sdBtn = entityPopup.querySelector('button[data-role="send-down"]');
  if (sdBtn) sdBtn.addEventListener('click', () => changeLayer(-1));

  // Opacity slider — basic shapes only (always adjustable)
  const opInput = entityPopup.querySelector('input[data-role="opacity"]');
  if (opInput) {
    const opLbl = entityPopup.querySelector('[data-role="opacity-val"]');
    opInput.addEventListener('input', () => {
      const sh = state.shapes.find(s => s.id === sel.id);
      if (!sh) return;
      const pct = parseInt(opInput.value, 10) || 100;
      sh.opacity = pct / 100;
      applyShapeVisual(sh);
      if (opLbl) opLbl.textContent = pct + '%';
    });
  }

  // Width / Height (feet) inputs — type an exact size. These stay in sync with
  // handle resizing (handles update these values; these update the shape).
  const widthInput = entityPopup.querySelector('input[data-role="width-ft"]');
  const heightInput = entityPopup.querySelector('input[data-role="height-ft"]');
  function applySizeFromInput(which, valFt) {
    const sh = state.shapes.find(s => s.id === sel.id);
    if (!sh) return;
    let px = feetToPx(valFt);
    if (!isFinite(px) || px <= 0) return;
    px = Math.max(MIN_SIZE, px);
    // Rooms are capped by their parent; other shapes by the working area.
    const parent = sh.type === 'room' ? state.shapes.find(s => s.id === sh.parentId) : null;
    const maxX = parent ? parent.x + parent.w : canvasSize().w;
    const maxY = parent ? parent.y + parent.h : canvasSize().h;
    if (which === 'w') sh.w = Math.min(px, maxX - sh.x);
    else sh.h = Math.min(px, maxY - sh.y);
    applyShapeVisual(sh);
    if (sh.type !== 'room') clampRoomsToParent(sh); // keep its rooms inside
    positionPanel();
  }
  if (widthInput) {
    widthInput.addEventListener('input', () => applySizeFromInput('w', parseFloat(widthInput.value)));
    // On blur, snap the field to the shape's actual (clamped) width.
    widthInput.addEventListener('change', () => {
      const sh = state.shapes.find(s => s.id === sel.id);
      if (sh) widthInput.value = pxToFeet(sh.w);
      persistCanvas();
    });
  }
  if (heightInput) {
    heightInput.addEventListener('input', () => applySizeFromInput('h', parseFloat(heightInput.value)));
    heightInput.addEventListener('change', () => {
      const sh = state.shapes.find(s => s.id === sel.id);
      if (sh) heightInput.value = pxToFeet(sh.h);
      persistCanvas();
    });
  }

  // Lock all inputs when the panel is in read-only mode. Range inputs ignore
  // `readonly`, so use `disabled` for those (and checkboxes/radios). Roads,
  // driveways, trees, and bushes are always directly editable so they skip this.
  // The opacity slider stays usable regardless of edit mode.
  if (!shouldUnlockPanel()) {
    entityPopup.querySelectorAll('input').forEach(inp => {
      if (inp.dataset.role === 'opacity') return;
      // Width / Height inputs are always editable so any shape can be resized.
      if (inp.dataset.role === 'width-ft' || inp.dataset.role === 'height-ft') return;
      const t = inp.type;
      if (t === 'range' || t === 'checkbox' || t === 'radio') {
        inp.disabled = true;
      } else {
        inp.setAttribute('readonly', 'readonly');
      }
    });
  }

  // Measurement inputs (per-side / per-unit, all entity kinds)
  entityPopup.querySelectorAll('input[data-meas-side]').forEach(inp => {
    const side = inp.dataset.measSide;
    const unit = inp.dataset.measUnit; // 'feet' or 'inches'
    inp.addEventListener('focus', () => closeMeasurePopup());
    inp.addEventListener('input', () => {
      const target = sel.kind === 'shape'
        ? state.shapes.find(s => s.id === sel.id)
        : sel.kind === 'arrow'
          ? state.arrows.find(x => x.id === sel.id)
          : sel.kind === 'fence'
            ? state.fences.find(f => f.id === sel.id)
            : null;
      if (!target) return;
      if (!target.measurements) target.measurements = emptyMeasurements();
      if (!target.measurements[side] || typeof target.measurements[side] !== 'object') {
        target.measurements[side] = { feet: '', inches: '' };
      }
      target.measurements[side][unit] = inp.value;
      if (sel.kind === 'shape') {
        const el = shapeEls.get(target.id);
        if (el) rebuildMeasurementLabels(el, target);
      } else {
        renderOverlay();
      }
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === 'Escape') {
        e.preventDefault();
        inp.blur();
      }
    });
  });

  // Arrow distance input (centered along the arrow line)
  const distInput = entityPopup.querySelector('input[data-role="arrow-distance"]');
  if (distInput) {
    distInput.addEventListener('input', () => {
      const a = state.arrows.find(x => x.id === sel.id);
      if (!a) return;
      a.distance = distInput.value;
      renderOverlay();
    });
    distInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === 'Escape') {
        e.preventDefault();
        distInput.blur();
      }
    });
  }
}

function positionPanel() {
  if (!state.selection) return;
  const sel = state.selection;
  const PAD = 12;
  let anchor = null;
  if (sel.kind === 'shape') {
    const el = shapeEls.get(sel.id);
    if (!el) return;
    anchor = el.getBoundingClientRect();
  } else if (sel.kind === 'arrow') {
    const a = state.arrows.find(x => x.id === sel.id);
    if (!a) return;
    const cr = canvasEl.getBoundingClientRect();
    const mx = cr.left + (a.x1 + a.x2) / 2;
    const my = cr.top + (a.y1 + a.y2) / 2;
    anchor = { left: mx, top: my, right: mx + 1, bottom: my + 1, width: 0, height: 0 };
  } else if (sel.kind === 'fence') {
    const f = state.fences.find(x => x.id === sel.id);
    if (!f) return;
    const cr = canvasEl.getBoundingClientRect();
    const mx = cr.left + (f.x1 + f.x2) / 2;
    const my = cr.top + (f.y1 + f.y2) / 2;
    anchor = { left: mx, top: my, right: mx + 1, bottom: my + 1, width: 0, height: 0 };
  }
  if (!anchor) return;
  const pw = entityPopup.offsetWidth || 240;
  const ph = entityPopup.offsetHeight || 120;
  let x = anchor.right + PAD;
  let y = anchor.top;
  if (x + pw > window.innerWidth - PAD) {
    x = anchor.left - pw - PAD;
  }
  // Final clamp so the panel is always fully on-screen, even on small devices
  x = Math.min(Math.max(PAD, x), Math.max(PAD, window.innerWidth - pw - PAD));
  y = Math.min(Math.max(PAD, y), Math.max(PAD, window.innerHeight - ph - PAD));
  entityPopup.style.left = x + 'px';
  entityPopup.style.top = y + 'px';
}

// ============= MEASUREMENT POPUP =============

function openMeasurePopup(entity, side, e, kind) {
  kind = kind || 'shape';
  if (!entity.measurements) {
    entity.measurements = emptyMeasurements();
  }
  if (!entity.measurements[side] || typeof entity.measurements[side] !== 'object') {
    entity.measurements[side] = { feet: '', inches: '' };
  }
  const cur = entity.measurements[side];

  const ep = evtPoint(e);
  const x = ep.clientX, y = ep.clientY;
  measurePopup.innerHTML =
    '<div class="title">' + side + ' edge</div>' +
    '<div class="ft-in-popup">' +
      '<div class="ft-in-popup-field"><label>Feet</label>' +
      '<input type="number" min="0" data-role="meas-feet" value="' + escHtml(cur.feet || '') + '" autocomplete="off"></div>' +
      '<div class="ft-in-popup-field"><label>Inches</label>' +
      '<input type="number" min="0" data-role="meas-inches" value="' + escHtml(cur.inches || '') + '" autocomplete="off"></div>' +
    '</div>' +
    '<div class="row">' +
      '<button data-role="clear" type="button">Clear</button>' +
      '<button class="primary" data-role="save" type="button">Save</button>' +
    '</div>';
  measurePopup.style.display = 'block';

  // Position with viewport clamp (kept fully on-screen on small devices)
  const pw = measurePopup.offsetWidth || 240, ph = measurePopup.offsetHeight || 140;
  let px = x + 8, py = y + 8;
  if (px + pw > window.innerWidth - 8) px = x - pw - 8;
  if (py + ph > window.innerHeight - 8) py = y - ph - 8;
  px = Math.min(Math.max(8, px), Math.max(8, window.innerWidth - pw - 8));
  py = Math.min(Math.max(8, py), Math.max(8, window.innerHeight - ph - 8));
  measurePopup.style.left = px + 'px';
  measurePopup.style.top = py + 'px';

  const fInp = measurePopup.querySelector('input[data-role="meas-feet"]');
  const iInp = measurePopup.querySelector('input[data-role="meas-inches"]');
  fInp.focus();
  fInp.select();

  const refresh = () => {
    if (kind === 'shape') {
      const el = shapeEls.get(entity.id);
      if (el) rebuildMeasurementLabels(el, entity);
    } else if (kind === 'arrow' || kind === 'fence') {
      renderOverlay();
    }
    // Sync same-side ft/in inputs in the entity panel, if visible (top/right only)
    const panelFt = entityPopup.querySelector('input[data-meas-side="' + side + '"][data-meas-unit="feet"]');
    const panelIn = entityPopup.querySelector('input[data-meas-side="' + side + '"][data-meas-unit="inches"]');
    if (panelFt) panelFt.value = entity.measurements[side].feet || '';
    if (panelIn) panelIn.value = entity.measurements[side].inches || '';
  };

  const save = () => {
    entity.measurements[side] = { feet: fInp.value, inches: iInp.value };
    refresh();
    closeMeasurePopup();
  };
  const clear = () => {
    entity.measurements[side] = { feet: '', inches: '' };
    refresh();
    closeMeasurePopup();
  };

  measurePopup.onmousedown = (ev) => ev.stopPropagation();
  measurePopup.onclick = (ev) => ev.stopPropagation();
  const onKey = (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); save(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); closeMeasurePopup(); }
  };
  fInp.addEventListener('keydown', onKey);
  iInp.addEventListener('keydown', onKey);
  measurePopup.querySelector('button[data-role="save"]').addEventListener('click', save);
  measurePopup.querySelector('button[data-role="clear"]').addEventListener('click', clear);
}

function closeMeasurePopup() {
  measurePopup.style.display = 'none';
  measurePopup.innerHTML = '';
}

// ============= TOOLS =============

function setTool(t) {
  state.tool = t;
  if (state.drawing && (!t || state.drawing.type !== t)) {
    state.drawing = null;
    renderOverlay();
  }
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  canvasEl.classList.toggle('tool-active', !!t);
  if (t) deselect();
}

// ============= COMPASS =============

let compassRotation = 0;
function rotateCompass() {
  compassRotation += 90;
  compassSvg.style.transform = 'rotate(' + compassRotation + 'deg)';
}

// ============= INIT / WIRING =============

// Default sizes for click-to-place items
const PLACE_SIZES = {
  square:    { w: 100, h: 100 },
  rectangle: { w: 160, h: 100 },
  circle:    { w: 100, h: 100 },
  triangle:  { w: 120, h: 100 },
  road:      { w: 200, h: 60 },
  driveway:  { w: 150, h: 50 },
  tree:      { w: 80,  h: 100 },
  bush:      { w: 90,  h: 70 },
  septic:    { w: 160, h: 70 },
  wellhead:  { w: 80,  h: 80 },
};
// Shapes that place unnamed and prompt the user to type a name
const UNNAMED_TYPES = ['square', 'rectangle', 'circle', 'triangle'];

// Successive placements step diagonally so items never stack exactly.
let placeCounter = 0;
function nextPlaceOffset() {
  const i = placeCounter % 6;
  placeCounter++;
  return i * 26;
}

// Place an item (shape type, arrow, or fence) at the centre of the canvas.
function placeFromSidebar(kind) {
  const cs = canvasSize();
  const off = nextPlaceOffset();
  const vc = viewportCenterContent(); // place at the center of what the user sees

  if (kind === 'arrow' || kind === 'fence') {
    const len = 130;
    const cx = vc.x + off;
    const cy = Math.max(0, Math.min(cs.h, vc.y + off));
    const x1 = Math.max(0, Math.min(cs.w - len, cx - len / 2));
    const x2 = x1 + len;
    const id = uid();
    if (kind === 'arrow') {
      addArrow({ id, x1, y1: cy, x2, y2: cy, color: '#000000', distance: '', measurements: emptyMeasurements() });
      selectEntity('arrow', id);
    } else {
      addFence({ id, x1, y1: cy, x2, y2: cy, color: '#000000', measurements: emptyMeasurements() });
      selectEntity('fence', id);
    }
    // A freshly placed item opens its panel so it can be configured right away.
    openPanel();
    return;
  }

  const def = PLACE_SIZES[kind];
  if (!def) return;
  const x = Math.max(0, Math.min(cs.w - def.w, vc.x - def.w / 2 + off));
  const y = Math.max(0, Math.min(cs.h - def.h, vc.y - def.h / 2 + off));
  addShape(kind, x, y, def.w, def.h); // selects the new shape
  // Open the panel so the user can immediately name / configure the new shape.
  openPanel();
}

function init() {
  // Tools & Shapes drawer controls.
  // The menu opens ONLY from a deliberate tap on this hamburger button — nothing
  // else in the app calls openSidebar(). Stop the event here so the tap can never
  // bubble to other handlers (or be confused with a canvas/shape interaction).
  const menuBtn = document.getElementById('menuBtn');
  if (menuBtn) menuBtn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const sb = document.getElementById('sidebar');
    if (sb && sb.classList.contains('open')) closeSidebar();
    else openSidebar();
  });
  const sidebarClose = document.getElementById('sidebarClose');
  if (sidebarClose) sidebarClose.addEventListener('click', closeSidebar);
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  if (sidebarBackdrop) sidebarBackdrop.addEventListener('click', closeSidebar);

  // Sidebar shape cards — click to place at the canvas centre, then close the
  // mobile drawer so the full canvas is visible (no-op on desktop).
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => { placeFromSidebar(card.dataset.shape); closeSidebar(); });
  });

  // Sidebar tool buttons — click to place at the canvas centre, then close drawer
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => { placeFromSidebar(btn.dataset.tool); closeSidebar(); });
  });

  // Fence: tap to set start point, tap again to set end point, then auto-deactivate
  function handleFenceTap(p) {
    if (!state.drawing || state.drawing.type !== 'fence') {
      state.drawing = { type: 'fence', x1: p.x, y1: p.y, x2: p.x, y2: p.y };
      renderOverlay();
    } else {
      const dx = p.x - state.drawing.x1;
      const dy = p.y - state.drawing.y1;
      if (Math.hypot(dx, dy) >= 8) {
        const newId = uid();
        addFence({
          id: newId,
          x1: state.drawing.x1, y1: state.drawing.y1,
          x2: p.x, y2: p.y,
          color: '#000000',
          measurements: emptyMeasurements(),
        });
        state.drawing = null;
        setTool(null);
        selectEntity('fence', newId);
        openPanel();
      } else {
        state.drawing = null;
        renderOverlay();
      }
    }
  }

  // Canvas pointer down — background deselect, fence tap, or start drag-draw
  // (arrow / road / driveway). Works for both mouse and touch.
  function onCanvasDown(e) {
    if (e.type === 'mousedown' && e.button !== 0) return;
    const isTouch = e.type === 'touchstart';
    const p = canvasPoint(e);
    if (state.tool === 'fence') {
      if (isTouch) e.preventDefault();
      handleFenceTap(p);
    } else if (state.tool === 'arrow' || state.tool === 'road' || state.tool === 'driveway') {
      if (isTouch) e.preventDefault();
      state.drawing = { type: state.tool, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
      renderOverlay();
    } else if (state.tool == null) {
      // Background tap → deselect (children stop propagation themselves).
      deselect();
      // Desktop: click-drag an empty area to pan. (Touch pans with two fingers.)
      if (e.type === 'mousedown') startCanvasPan(e);
    }
  }
  canvasEl.addEventListener('mousedown', onCanvasDown);
  canvasEl.addEventListener('touchstart', onCanvasDown, { passive: false });
  // Two-finger pan + pinch zoom — capture phase so it pre-empts the single-finger
  // shape-drag / canvas handlers the moment a second finger lands.
  canvasEl.addEventListener('touchstart', onGestureStart, { capture: true, passive: false });

  function onCanvasMove(e) {
    if (!state.drawing || state.drawing.type === 'fence') return;
    if (e.type === 'touchmove' && e.cancelable) e.preventDefault();
    const p = canvasPoint(e);
    state.drawing.x2 = p.x;
    state.drawing.y2 = p.y;
    renderOverlay();
  }
  canvasEl.addEventListener('mousemove', onCanvasMove);
  canvasEl.addEventListener('touchmove', onCanvasMove, { passive: false });

  function onCanvasUp(e) {
    if (!state.drawing) return;
    const d = state.drawing;
    // Fence drawing is tap-driven, not drag-driven — handled in onCanvasDown
    if (d.type === 'fence') return;

    if (d.type === 'arrow') {
      const len = Math.hypot(d.x2 - d.x1, d.y2 - d.y1);
      if (len >= 8) {
        const newId = uid();
        addArrow({
          id: newId,
          x1: d.x1, y1: d.y1, x2: d.x2, y2: d.y2,
          color: '#000000',
          distance: '',
          measurements: emptyMeasurements(),
        });
        // Auto-deactivate the arrow tool and select the new arrow so the user
        // can immediately tweak its distance / colour / measurements.
        setTool(null);
        selectEntity('arrow', newId);
        openPanel();
      }
    } else if (d.type === 'road' || d.type === 'driveway') {
      const dx = Math.abs(d.x2 - d.x1);
      const dy = Math.abs(d.y2 - d.y1);
      // Require some meaningful drag, otherwise treat as accidental tap
      if (dx >= 8 || dy >= 8) {
        const rx = Math.min(d.x1, d.x2);
        const ry = Math.min(d.y1, d.y2);
        let rw = Math.max(MIN_SIZE, dx);
        let rh = Math.max(MIN_SIZE, dy);
        const cs = canvasSize();
        const fx = Math.max(0, Math.min(cs.w - rw, rx));
        const fy = Math.max(0, Math.min(cs.h - rh, ry));
        rw = Math.min(rw, cs.w - fx);
        rh = Math.min(rh, cs.h - fy);
        addShape(d.type, fx, fy, rw, rh);
        openPanel();
      }
    }

    state.drawing = null;
    renderOverlay();
  }
  canvasEl.addEventListener('mouseup', onCanvasUp);
  canvasEl.addEventListener('touchend', onCanvasUp);

  // Compass
  compassBtn.addEventListener('mousedown', (e) => e.stopPropagation());
  compassBtn.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    e.preventDefault();
    rotateCompass();
  }, { passive: false });
  compassBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    rotateCompass();
  });

  // Zoom buttons — work for both mouse clicks and finger taps. stopPropagation
  // keeps a tap on a button from reaching the canvas; preventDefault on
  // touchstart suppresses the synthetic click so each tap fires the action once.
  function wireZoomButton(btn, fn) {
    if (!btn) return;
    btn.addEventListener('mousedown', (e) => e.stopPropagation());
    btn.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      e.preventDefault();
      fn();
    }, { passive: false });
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      fn();
    });
  }
  wireZoomButton(document.getElementById('zoomInBtn'), zoomIn);
  wireZoomButton(document.getElementById('zoomOutBtn'), zoomOut);
  // Size the working area (2x the viewport) and fit the whole thing on screen.
  computeWorldSize();
  applyWorldSize();
  zoom = fitZoom();
  panX = 0; panY = 0;
  applyZoom(); // clampPan centers the world; sets transform + label

  // Keyboard
  window.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;

    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (state.selection) {
        e.preventDefault();
        const { kind, id } = state.selection;
        if (kind === 'shape') deleteShape(id);
        else if (kind === 'arrow') deleteArrow(id);
        else if (kind === 'fence') deleteFence(id);
      }
    } else if (e.key === 'Escape') {
      e.preventDefault();
      const drawer = document.getElementById('blueprintsDrawer');
      const sb = document.getElementById('sidebar');
      if (drawer && drawer.classList.contains('open')) closeBlueprintsDrawer();
      else if (sb && sb.classList.contains('open')) closeSidebar();
      else if (state.drawing) { state.drawing = null; renderOverlay(); }
      else if (state.tool) setTool(null);
      else if (state.selection) deselect();
    }
  });

  // Reposition popup + re-clamp the pan when the viewport changes size
  window.addEventListener('resize', () => {
    applyZoom();
    if (state.selection) positionPanel();
  });

  // Save / load blueprint buttons
  const saveBpBtn = document.getElementById('saveBlueprintBtn');
  if (saveBpBtn) saveBpBtn.addEventListener('click', saveBlueprint);
  const myBpBtn = document.getElementById('myBlueprintsBtn');
  if (myBpBtn) myBpBtn.addEventListener('click', openBlueprintsDrawer);

  // Start New Blueprint — warning modal with Save First / Start Fresh / Cancel
  const newModal = document.getElementById('newBlueprintModal');
  const openNewModal = () => { if (newModal) newModal.style.display = 'flex'; };
  const closeNewModal = () => { if (newModal) newModal.style.display = 'none'; };
  const startNewBtn = document.getElementById('startNewBtn');
  if (startNewBtn) startNewBtn.addEventListener('click', () => { closeSidebar(); openNewModal(); });
  const newBpCancel = document.getElementById('newBpCancel');
  if (newBpCancel) newBpCancel.addEventListener('click', closeNewModal);
  if (newModal) newModal.addEventListener('click', (e) => { if (e.target === newModal) closeNewModal(); });
  const newBpStartFresh = document.getElementById('newBpStartFresh');
  if (newBpStartFresh) newBpStartFresh.addEventListener('click', () => { closeNewModal(); startFreshCanvas(); });
  const newBpSaveFirst = document.getElementById('newBpSaveFirst');
  if (newBpSaveFirst) newBpSaveFirst.addEventListener('click', () => {
    closeNewModal();
    // Open the Save flow; only clear if the save actually completed.
    if (saveBlueprint()) startFreshCanvas();
  });
  const bpClose = document.getElementById('blueprintsClose');
  if (bpClose) bpClose.addEventListener('click', closeBlueprintsDrawer);
  const bpBackdrop = document.getElementById('blueprintsBackdrop');
  if (bpBackdrop) bpBackdrop.addEventListener('click', closeBlueprintsDrawer);
  const loadFileBtn = document.getElementById('loadFromFileBtn');
  const fileInput = document.getElementById('blueprintFileInput');
  if (loadFileBtn && fileInput) {
    loadFileBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) importBlueprintFile(file);
      fileInput.value = ''; // allow re-selecting the same file later
    });
  }

  // Save as PDF button — uses jsPDF + html2canvas (loaded from CDN above)
  const savePdfBtn = document.getElementById('savePdfBtn');
  if (savePdfBtn) {
    savePdfBtn.addEventListener('click', async () => {
      if (savePdfBtn.disabled) return;
      if (typeof window.html2canvas !== 'function' || !window.jspdf || !window.jspdf.jsPDF) {
        alert('PDF export libraries failed to load. Please check your internet connection and try again.');
        return;
      }

      const originalHtml = savePdfBtn.innerHTML;
      savePdfBtn.disabled = true;
      savePdfBtn.innerHTML = 'Saving…';

      const pdfPrevZoom = zoom;
      const pdfPrevPanX = panX, pdfPrevPanY = panY;
      const zoomControlsEl = document.querySelector('.zoom-controls');

      try {
        // Clear selection and any popups so handles / blue rings / floating panels
        // don't get baked into the export.
        deselect();
        closeMeasurePopup();
        // Fit the entire working area in the viewport so the whole plan is captured
        // (the world is larger than the viewport). Hide the zoom buttons too.
        // Restored in finally.
        zoom = fitZoom(); panX = 0; panY = 0; applyZoom();
        if (zoomControlsEl) zoomControlsEl.style.visibility = 'hidden';
        // Yield one frame so the DOM updates land before we capture.
        await new Promise(r => requestAnimationFrame(r));

        const snapshot = await window.html2canvas(canvasEl, {
          backgroundColor: '#f8fafc',
          scale: 2,
          logging: false,
          useCORS: true,
        });

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: 'landscape',
          unit: 'pt',
          format: 'letter', // 11 x 8.5 in landscape = 792 x 612 pt
        });

        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        const margin = 28; // ~0.39 in on every side
        const contentW = pageW - 2 * margin;
        const contentH = pageH - 2 * margin;
        const imgW = snapshot.width;
        const imgH = snapshot.height;

        // Notes header (skipped entirely if the field is empty)
        const notesEl = document.getElementById('notesTextarea');
        const notesText = ((notesEl && notesEl.value) || '').trim();
        let canvasAreaTop = margin;
        const gapBelowNotes = 10;

        if (notesText) {
          const labelSize = 9;
          const notesSize = 10;
          const lineHeight = 12;
          const labelToText = 6;

          // Wrap notes to fit the printable width
          pdf.setFont('helvetica', 'normal');
          pdf.setFontSize(notesSize);
          const wrapped = pdf.splitTextToSize(notesText, contentW);

          // Cap the notes block at ~40% of available height so the canvas always has room
          const maxNotesH = contentH * 0.4;
          const labelTotal = labelSize + labelToText;
          const maxLines = Math.max(1, Math.floor((maxNotesH - labelTotal) / lineHeight));
          const lines = wrapped.length > maxLines ? wrapped.slice(0, maxLines) : wrapped;

          // "Notes" label
          pdf.setFont('helvetica', 'bold');
          pdf.setFontSize(labelSize);
          pdf.setTextColor(71, 85, 105);
          pdf.text('NOTES', margin, margin, { baseline: 'top' });

          // Notes body
          pdf.setFont('helvetica', 'normal');
          pdf.setFontSize(notesSize);
          pdf.setTextColor(30, 41, 59);
          pdf.text(lines, margin, margin + labelTotal, { baseline: 'top' });

          // Thin separator between notes and canvas
          const blockH = labelTotal + lines.length * lineHeight;
          const sepY = margin + blockH + gapBelowNotes / 2;
          pdf.setDrawColor(203, 213, 225);
          pdf.setLineWidth(0.5);
          pdf.line(margin, sepY, pageW - margin, sepY);

          canvasAreaTop = margin + blockH + gapBelowNotes;
        }

        // Centered canvas in whatever space is left under the notes
        const canvasAreaH = (pageH - margin) - canvasAreaTop;
        const canvasAreaW = contentW;
        const fitScale = Math.min(canvasAreaW / imgW, canvasAreaH / imgH);
        const drawW = imgW * fitScale;
        const drawH = imgH * fitScale;
        const drawX = margin + (canvasAreaW - drawW) / 2;
        const drawY = canvasAreaTop + (canvasAreaH - drawH) / 2;

        pdf.addImage(snapshot.toDataURL('image/png'), 'PNG', drawX, drawY, drawW, drawH);
        pdf.save('blueprint.pdf');
      } catch (err) {
        console.error('PDF export failed:', err);
        alert('PDF export failed: ' + (err && err.message ? err.message : err));
      } finally {
        // Restore the user's zoom level, pan, and the zoom buttons.
        zoom = pdfPrevZoom;
        panX = pdfPrevPanX; panY = pdfPrevPanY;
        applyZoom();
        if (zoomControlsEl) zoomControlsEl.style.visibility = '';
        savePdfBtn.disabled = false;
        savePdfBtn.innerHTML = originalHtml;
      }
    });
  }

  // Notes textarea — persisted to localStorage
  const notesTa = document.getElementById('notesTextarea');
  if (notesTa) {
    try {
      const saved = localStorage.getItem('blueprint.notes');
      if (saved != null) notesTa.value = saved;
    } catch (_) {}
    notesTa.addEventListener('input', () => {
      try { localStorage.setItem('blueprint.notes', notesTa.value); } catch (_) {}
    });
  }

  loadSavedNames();
  loadCanvas();
  updatePlaceholder();
}

init();
})();
</script>

</body>
</html>
